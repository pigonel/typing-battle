<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>タイピングバトル</title>
<style>
:root{--bg:#1b1f4b;--glow:#3a3f9a;--panel:#262b66;--line:#4a52a8;--text:#f4f1ff;--sub:#aab0e6;--hit:#ffd23f;--hit-ink:#1b1f4b;--warn:#ff8a7a;color-scheme:dark}
:root[data-theme=light]{--bg:#e6eaff;--glow:#cfd7ff;--panel:#fff;--line:#aab3e8;--text:#1b1f4b;--sub:#4d559c;--hit:#e8a800;--hit-ink:#1b1f4b;--warn:#b3321f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.7 "Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:radial-gradient(900px 520px at 12% -12%,var(--glow),transparent 70%),var(--bg)}
#app{max-width:1080px;margin:0 auto;padding:24px 20px 48px}
h1{margin:0 0 16px;font-size:30px;font-weight:900}
.screen{animation:in .15s ease-out}
@keyframes in{from{opacity:0}}
[data-fx=off] *,[data-fx=off] *::before{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hud{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.chip{display:flex;flex-direction:column;min-width:112px;padding:6px 16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--hit);transform:skewX(-6deg)}
.chip small{font-size:12px;color:var(--sub);line-height:1.4}
.chip b{font-size:16px;font-weight:800}

.menu{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:34px}
@media(max-width:720px){.menu{grid-template-columns:1fr}}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:baseline;gap:14px;padding:12px 20px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);transform:skewX(-8deg);transition:transform .1s,background .1s,border-color .1s}
.menu-item .jp{font-size:20px;font-weight:900}
.menu-item .en{font-size:13px;font-style:italic;color:var(--sub)}
.menu-item.is-active{transform:skewX(-8deg) translateX(14px);background:var(--hit);border-color:var(--hit);color:var(--hit-ink)}
.menu-item.is-active .en{color:var(--hit-ink)}
.menu-item.is-off{opacity:.5;cursor:not-allowed}
.menu-item:focus-visible{outline:3px solid var(--text);outline-offset:3px}

.preview,.panel{background:var(--panel);border:1px solid var(--line);padding:24px 28px}
.preview h2{margin:0 0 8px;font-size:40px;font-weight:900;line-height:1.2}
.preview ul{padding-left:1.2em;color:var(--sub)}
.warn{color:var(--warn);font-weight:800}
.note{color:var(--sub)}

.form{display:grid;gap:20px;max-width:640px}
.field{display:grid;gap:4px;margin:0;padding:0;border:0}
.field small{color:var(--sub)}
.field legend{padding:0;margin-bottom:4px}
.field label{display:block}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);padding:8px 10px}
input[type=checkbox]{margin-right:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.field .row{margin-top:4px}
.btn{font:inherit;font-weight:800;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:8px 20px;cursor:pointer}
.btn.primary{background:var(--hit);border-color:var(--hit);color:var(--hit-ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hit);outline-offset:2px}

/* ---- トレーニング設定 ---- */
.tr-grid{display:grid;grid-template-columns:minmax(300px,1.15fr) 1fr;gap:24px;align-items:start}
@media(max-width:900px){.tr-grid{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:6px 4px 8px;background:var(--bg);border:2px solid var(--line)}
.card svg{width:100%;height:auto;display:block}
.card b{display:block;font-size:14px}
.card small{color:var(--sub);font-size:12px}
.card[aria-pressed=true]{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 16%,var(--panel))}
.card:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.detail{margin-top:14px;font-size:14px;color:var(--sub)}
.detail b{color:var(--text)}
.detail ul{margin:6px 0 0;padding-left:1.2em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:700;color:var(--text);background:var(--bg);border:2px solid var(--line);padding:4px 12px;cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--hit);background:var(--hit);color:var(--hit-ink)}
.seg button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.field output{font-weight:800;color:var(--hit)}

/* ---- バトル ---- */
.battle{display:grid;gap:12px;position:relative}
.bt-top{display:grid;grid-template-columns:1fr 96px 1fr;gap:16px;align-items:start}
.bt-name{font-weight:900;font-size:19px;line-height:1.3}
.bt-name small{font-size:12px;font-weight:700;color:var(--sub);margin-left:6px}
.bt-side.right{text-align:right}
.hpbar{position:relative;height:24px;margin:4px 8px 2px;background:#0007;border:2px solid var(--line);transform:skewX(-14deg);overflow:hidden}
.right .hpbar{transform:skewX(14deg)}
.hpbar i{position:absolute;top:0;bottom:0;left:0;width:100%}
.right .hpbar i{left:auto;right:0}
.hp-ghost{background:#ff6b6b;transition:width .5s .2s}
.hp-fill{background:linear-gradient(90deg,#3ddc97,#c4f77e);transition:width .08s}
.hp-fill.low{background:linear-gradient(90deg,#ff5d5d,#ffb36b)}
.hp-num{font-size:13px;color:var(--sub);margin:0 8px}
.mini-gauge{height:6px;margin:4px 8px 0;background:#0007}
.mini-gauge i{display:block;height:100%;background:linear-gradient(90deg,#5ef2ff,#b57cff)}
.right .mini-gauge i{margin-left:auto}
.bt-timer{text-align:center;font-size:40px;font-weight:900;line-height:1.1;padding:4px 0;background:var(--panel);border:2px solid var(--line)}
.bt-timer small{display:block;font-size:11px;font-weight:700;color:var(--sub)}
.stage{position:relative;display:flex;justify-content:space-between;align-items:flex-end;height:min(34vh,300px);padding:0 7%;overflow:hidden;border-bottom:4px solid var(--line);background:radial-gradient(120% 90% at 50% 120%,color-mix(in srgb,var(--glow) 70%,transparent),transparent 70%)}
.fighter{position:relative;height:100%;aspect-ratio:200/260}
.fighter svg{height:100%;width:100%;display:block}
.fighter.r svg{transform:scaleX(-1)}
.flash{position:absolute;inset:0;background:#ff2d4a;opacity:0;pointer-events:none}
.banner{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,12vw,120px);font-weight:900;font-style:italic;pointer-events:none;text-shadow:0 4px 0 #0007}
.banner.go{color:var(--hit)}
.dmg{position:absolute;font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 0 #000a;color:#fff}
.dmg.crit{color:var(--hit);font-size:32px}
.dmg.self{color:#ff8a7a}
.dmg.fx{color:#cdbfff;font-size:26px;white-space:nowrap}
.typing{background:var(--panel);border:2px solid var(--line);padding:14px 22px 16px;text-align:center;min-height:168px}
.t-disp{color:var(--sub);font-size:18px;min-height:1.7em}
.t-kana{font-size:clamp(24px,4vw,40px);font-weight:900;line-height:1.4;word-break:break-all}
.t-rom{font:700 clamp(18px,2.6vw,26px)/1.5 ui-monospace,Consolas,monospace;word-break:break-all;margin-top:6px}
.t-kana .done,.t-rom .done{color:var(--hit)}
.t-rom .rest{color:var(--sub)}
.t-rom u{text-decoration:none;color:var(--text);border-bottom:3px solid var(--hit)}
.hud-b{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.combo{text-align:center;font-size:13px;color:var(--sub)}
.combo b{display:block;font-size:40px;line-height:1;font-weight:900;color:var(--hit)}
.gauge{position:relative;height:18px;background:#0007;border:2px solid var(--line)}
.gauge .g-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#5ef2ff,#b57cff)}
.gauge .tick{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--text)}
.skills{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.skill{flex:1;min-width:220px;padding:6px 14px;border:2px solid var(--line);background:var(--panel);opacity:.55;transition:opacity .15s}
.skill b{font-size:16px}
.skill kbd{float:right;font:700 12px ui-monospace,Consolas,monospace;padding:1px 8px;border:1px solid var(--line);background:var(--bg)}
.skill small{display:block;color:var(--sub);font-size:12px}
.skill.ready{opacity:1;border-color:var(--hit);box-shadow:0 0 16px color-mix(in srgb,var(--hit) 55%,transparent)}
.overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#000b}
.overlay[hidden]{display:none}
.overlay .box{background:var(--panel);border:2px solid var(--hit);padding:26px 34px;width:min(540px,92vw)}
.overlay h2{margin:0 0 4px;font-size:40px;font-weight:900}
.overlay .sub{color:var(--sub);margin:0 0 14px}
.overlay dl{display:grid;grid-template-columns:1fr auto;gap:2px 20px;margin:0 0 6px}
.overlay dt{color:var(--sub)}.overlay dd{margin:0;font-weight:800;text-align:right}
.overlay .row{margin-top:16px}

/* ---- バトル画面の追加表示 ---- */
.bt-name em{display:block;font-style:normal;font-size:12px;font-weight:400;color:var(--sub)}
.bt-name .pv{display:inline-block;margin-top:2px;padding:0 8px;font-size:11px;font-weight:700;color:var(--hit-ink);background:var(--hit);transform:skewX(-10deg)}
.pips{display:flex;gap:6px;justify-content:center;align-items:center;font-size:12px;margin-top:2px;color:var(--hit)}
.pips i{font-style:normal;color:var(--sub)}

/* ---- マッチング ---- */
.mt{display:grid;justify-items:center;gap:6px;padding-top:24px;text-align:center}
.mt-mode{font-weight:900;font-size:18px;padding:2px 22px;background:var(--hit);color:var(--hit-ink);transform:skewX(-10deg)}
.mt-radar{position:relative;width:200px;height:200px;margin:18px 0 8px}
.mt-radar i{position:absolute;inset:0;border:2px solid var(--hit);border-radius:50%;opacity:0;animation:ping 2.4s ease-out infinite}
.mt-radar i:nth-child(2){animation-delay:.8s}.mt-radar i:nth-child(3){animation-delay:1.6s}
.mt-radar b{position:absolute;inset:78px;border-radius:50%;background:var(--hit);box-shadow:0 0 30px var(--hit)}
.mt-radar.ok i{animation:none;opacity:.5;inset:20px}.mt-radar.ok b{inset:60px;background:#59e08a;box-shadow:0 0 36px #59e08a}
@keyframes ping{from{transform:scale(.3);opacity:.9}to{transform:scale(1.15);opacity:0}}
.mt-msg{margin:0;font-size:28px;font-weight:900}.mt-time{margin:0;color:var(--sub);font-variant-numeric:tabular-nums}
.mt-found{display:flex;align-items:center;gap:22px;margin-top:10px}
.mt-found>span{font-size:34px;font-weight:900;font-style:italic;color:var(--hit)}
.mt-card{display:grid;gap:0;min-width:210px;padding:12px 22px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--hit);animation:slideL .35s ease-out;text-align:left}
.mt-card.r{border-left:1px solid var(--line);border-right:6px solid #ff7a6b;text-align:right;animation-name:slideR}
.mt-card small{color:var(--sub);font-size:12px}.mt-card b{font-size:24px}.mt-card em{font-style:normal;color:var(--hit);font-weight:700}
@keyframes slideL{from{transform:translateX(-60px);opacity:0}}@keyframes slideR{from{transform:translateX(60px);opacity:0}}

/* ---- ドラフト(BAN/PICK) ---- */
.dr-head{display:flex;justify-content:space-between;align-items:center;gap:16px}
.dr-steps{display:flex;gap:8px;flex-wrap:wrap}
.dr-steps span{padding:4px 16px;background:var(--panel);border:1px solid var(--line);font-weight:700;color:var(--sub);transform:skewX(-10deg)}
.dr-steps .on{background:var(--hit);color:var(--hit-ink);border-color:var(--hit)}.dr-steps .done{opacity:.55;text-decoration:line-through}
.dr-ring{--p:100;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--hit) calc(var(--p)*1%),var(--line) 0)}
.dr-ring b{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--bg);font-size:30px;font-weight:900}
.dr-guide{margin:12px 0;font-size:22px}
.dr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dr-card{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:8px 6px 10px;background:var(--panel);border:2px solid var(--line);text-align:center;transition:transform .1s,border-color .1s}
.dr-card:hover{transform:translateY(-3px);border-color:var(--sub)}
.dr-card .dr-art{display:block;width:100px;height:136px}.dr-card .dr-art svg{width:100%;height:100%}
.dr-card b{font-size:16px}.dr-card small{color:var(--sub);font-size:12px}
.dr-card.sel{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 16%,var(--panel));box-shadow:0 0 18px color-mix(in srgb,var(--hit) 50%,transparent)}
.dr-card.ban{opacity:.45;cursor:not-allowed;filter:grayscale(1)}
.dr-card.ban::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:84px;font-weight:900;color:#ff5a4d;text-shadow:0 0 10px #000}
.dr-card i{position:absolute;top:6px;left:6px;padding:0 8px;font-size:11px;font-style:normal;font-weight:700;background:#ff5a4d;color:#fff;z-index:1}
.dr-fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0}
.dr-fmt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;align-content:center;justify-items:center;gap:6px;min-height:150px;padding:14px;background:var(--panel);border:2px solid var(--line);font-size:22px;text-align:center}
.dr-fmt.sel{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 16%,var(--panel))}
.dr-fmt.ban{opacity:.5;text-decoration:line-through}.dr-fmt.final{opacity:1;text-decoration:none;border-color:#59e08a;box-shadow:0 0 22px #59e08a55}
.dr-fmt em{font-size:12px;font-style:normal;color:var(--hit)}
.dr-sub{color:var(--sub);font-size:13px;align-self:center}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---- VS画面 ---- */
.vs{position:relative;overflow:hidden}
.vs-head{display:flex;justify-content:space-between;font-weight:900;font-size:18px;padding-bottom:6px;border-bottom:3px solid var(--hit)}.vs-head span{color:var(--sub);font-weight:700}
.vs-stage{position:relative;display:grid;grid-template-columns:1fr 160px 1fr;align-items:end;height:400px;background:linear-gradient(105deg,color-mix(in srgb,var(--hit) 22%,transparent) 0 49%,transparent 49.2% 50.8%,color-mix(in srgb,#ff5a4d 22%,transparent) 51% 100%)}
.vs-p svg{width:100%;max-width:330px;height:auto;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.vs-p.l{justify-self:start;animation:vsL .5s cubic-bezier(.2,.9,.3,1)}.vs-p.r{justify-self:end;transform:scaleX(-1);animation:vsR .5s cubic-bezier(.2,.9,.3,1)}
@keyframes vsL{from{transform:translateX(-120%)}}@keyframes vsR{from{transform:scaleX(-1) translateX(-120%)}}
.vs-mid{display:grid;place-items:center;align-self:center}
.vs-mid span{font-size:96px;font-weight:900;font-style:italic;color:var(--hit);text-shadow:0 5px 0 #10122e,0 0 30px var(--hit);animation:vsPop .5s .35s backwards}
@keyframes vsPop{from{transform:scale(3) rotate(-12deg);opacity:0}}
.vs-info{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.vs-nm{display:grid;gap:0;padding:8px 18px;background:var(--panel);border-left:6px solid var(--hit)}
.vs-nm.r{text-align:right;border-left:0;border-right:6px solid #ff7a6b}
.vs-nm small{color:var(--sub)}.vs-nm b{font-size:30px;line-height:1.2}.vs-nm em{font-style:normal;color:var(--hit);font-weight:700}.vs-nm span{color:var(--sub);font-size:13px}
.vs-hint{text-align:center;color:var(--sub);margin:12px 0 0}

/* ---- リザルト ---- */
.rs{text-align:center;display:grid;justify-items:center;gap:4px;padding-top:14px}
.rs h1{font-size:64px;margin:0;font-style:italic}.rs.win h1{color:var(--hit);text-shadow:0 0 26px var(--hit)}
.rs-score{margin:0;font-size:34px;font-weight:900}.rs-lp{margin:6px 0 0;font-size:26px;font-weight:900}.rs-lp small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.rs-stats{display:grid;grid-template-columns:auto auto;gap:4px 28px;margin:14px 0;padding:14px 30px;background:var(--panel);border:1px solid var(--line);text-align:left}
.rs-stats dt{color:var(--sub)}.rs-stats dd{margin:0;font-weight:900;text-align:right}

/* ---- キャラ図鑑 ---- */
.cx{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:20px}
@media(max-width:820px){.cx{grid-template-columns:1fr}}
.cx-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start}
.cx-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:6px;background:var(--panel);border:2px solid var(--line);text-align:center}
.cx-item[aria-pressed=true]{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 14%,var(--panel))}
.cx-item:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.cx-thumb{display:block;width:76px;height:102px}.cx-thumb svg{width:100%;height:100%}
.cx-item b{font-size:15px}.cx-item small{color:var(--sub);font-size:12px}
.cx-detail{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.cx-detail{grid-template-columns:1fr}}
.cx-art svg{width:100%;height:auto}
.cx-info h2{margin:0;font-size:32px}.cx-info h2 small{margin-left:10px;font-size:14px;color:var(--sub);font-weight:400}
.cx-lore{color:var(--sub);margin:4px 0 12px}
.cx-bar{display:grid;grid-template-columns:64px 1fr 54px;gap:8px;align-items:center;font-size:14px}
.cx-bar i{height:10px;background:var(--bg);border:1px solid var(--line)}.cx-bar u{display:block;height:100%;background:linear-gradient(90deg,#6be6ff,var(--hit))}
.cx-bar b{text-align:right}
.cx-pas,.cx-sk{display:grid;gap:0;margin-top:10px;padding:8px 14px;background:var(--bg);border-left:5px solid var(--line)}
.cx-pas{border-left-color:var(--hit)}.cx-pas small,.cx-sk small{color:var(--sub);font-size:12px}.cx-pas span,.cx-sk span{color:var(--sub);font-size:14px}

/* ---- 称号 ---- */
.tt-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tt-tabs{display:flex;gap:6px;flex-wrap:wrap}
.seg-b{font:inherit;font-weight:700;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:6px 16px;cursor:pointer}
.seg-b[aria-pressed=true]{background:var(--hit);color:var(--hit-ink);border-color:var(--hit)}
.tt-count{color:var(--sub)}
.tt-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:820px){.tt-list{grid-template-columns:1fr}}
.tt-list .note{grid-column:1/-1;margin:0}
.tt-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--rc);opacity:.62}
.tt-item.own{opacity:1}.tt-item.eq{background:color-mix(in srgb,var(--rc) 16%,var(--panel));box-shadow:0 0 14px color-mix(in srgb,var(--rc) 45%,transparent)}
.tt-item div{display:grid;gap:0}.tt-item small{color:var(--rc);font-weight:700;font-size:12px}.tt-item b{font-size:18px}.tt-item span{color:var(--sub);font-size:13px}
.tt-item em{font-style:normal;color:var(--sub);font-size:13px}

/* ---- アカウント(画面左上) ---- */
#app{padding-top:64px}
#acct{position:fixed;top:10px;left:12px;z-index:30}#acct[hidden]{display:none}
.ab{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-left:4px solid var(--hit);backdrop-filter:blur(6px)}
.ab-dot{width:9px;height:9px;border-radius:50%;background:var(--sub)}.ab-dot.on{background:#59e08a;box-shadow:0 0 8px #59e08a}
.ab-name{display:grid;line-height:1.25}.ab-name b{font-size:14px}.ab-name small{font-size:11px;color:var(--sub)}
.ab .btn{padding:4px 12px;font-size:13px}

<script>
(() => {
'use strict';
// ---- js/core/dom.js
// ユーザー入力をHTMLに入れるときは必ずescを通す
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- js/core/store.js
// 最小のObservable Store。UI(DOM)に依存しない=将来サーバー同期にも使える
function createStore(initial) {
  let state = initial;
  const subs = new Set();
  return {
    get: () => state,
    set(patch) {
      state = { ...state, ...(typeof patch === 'function' ? patch(state) : patch) };
      subs.forEach(fn => fn(state));
    },
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
  };
}

// ---- js/data/titles.js
// 称号。r=レア度(C/R/E/L)。hidden=条件を「???」で隠す。獲得判定は将来サーバー側で行う
const RARITY = {
  C: { name: 'コモン', color: '#9fb3d9' }, R: { name: 'レア', color: '#4dabff' },
  E: { name: 'エピック', color: '#b57bff' }, L: { name: 'レジェンド', color: '#ffc933' },
};
const TITLE_CATS = [['all', 'すべて'], ['speed', '速度'], ['win', '勝利・連勝'], ['rank', 'ランク'], ['collect', 'コレクション'], ['play', '試合内容']];
const T = (id, name, r, cat, cond, hidden = false) => ({ id, name, r, cat, cond, hidden });
const TITLES = [
  T('s150', '駆け出しの指', 'C', 'speed', 'CPM 150に到達'), T('s200', '疾風の指先', 'R', 'speed', 'CPM 200に到達'),
  T('s250', '雷光の打鍵', 'R', 'speed', 'CPM 250に到達'), T('s300', '神速の指揮者', 'E', 'speed', 'CPM 300に到達'),
  T('s350', '音を置き去る者', 'E', 'speed', 'CPM 350に到達'), T('s400', '覚醒の指先', 'E', 'speed', 'CPM 400に到達', true),
  T('s450', '限界を超えし者', 'L', 'speed', 'CPM 450に到達', true), T('s500', '人智を超えた速さ', 'L', 'speed', 'CPM 500に到達', true),
  T('w3', '三連撃の使い手', 'C', 'win', '3連勝'), T('w5', '止まらぬ連勝', 'R', 'win', '5連勝'),
  T('w10', '十人斬り', 'E', 'win', '10連勝'), T('w20', '不敗の挑戦者', 'L', 'win', '20連勝'),
  T('t10', '初陣を越えし者', 'C', 'win', '通算10勝'), T('t50', '歴戦の打鍵手', 'R', 'win', '通算50勝'),
  T('t100', '百戦錬磨', 'E', 'win', '通算100勝'), T('t500', '五百戦の覇者', 'L', 'win', '通算500勝'),
  T('w30', '伝説の不敗神話', 'L', 'win', '30連勝', true), T('t1000', '千の戦場', 'L', 'win', '通算1000勝', true),
  T('place', '彗星の新人', 'E', 'win', '配置戦を全勝', true), T('demote', '踏みとどまる者', 'R', 'win', '降格戦で残留', true),
  T('r2', '銀の挑戦者', 'C', 'rank', 'シルバーに到達'), T('r3', '金の闘士', 'R', 'rank', 'ゴールドに到達'),
  T('r4', '白金の剣士', 'R', 'rank', 'プラチナに到達'), T('r5', '金剛の打鍵者', 'E', 'rank', 'ダイヤに到達'),
  T('r6', '頂へ至る者', 'L', 'rank', 'マスターに到達'), T('r7', '頂点の十傑', 'L', 'rank', 'グランドマスターに到達', true),
  T('c5', '五つの言葉', 'R', 'collect', '5種類すべての単語形式で勝利'), T('c8', '八つの顔', 'E', 'collect', '8体すべてのキャラで勝利'),
  T('cm', '言葉を極めし者', 'E', 'collect', '5種類すべての単語形式でミスなしで勝利', true), T('ca', '全てを統べる者', 'L', 'collect', '8体すべてのキャラで各10勝', true),
  T('p1', '完璧な一戦', 'R', 'play', 'ミスなし(自傷ダメージ0)で勝利', true), T('p2', '無傷の勝者', 'E', 'play', 'ランクマッチを2-0・ミスなしで勝利', true),
  T('p3', '崖っぷちの逆転劇', 'E', 'play', 'HP10%以下から逆転して勝利', true), T('p4', '時の裁定', 'C', 'play', '時間切れ判定で勝利', true),
  T('p5', '紙一重の決着', 'R', 'play', 'HP同率からの判定(文字数)で勝利', true), T('p6', '己との戦い', 'C', 'play', 'ミラーマッチで勝利', true),
  T('p7', '二つの切り札', 'C', 'play', '1試合でスキルを2種類とも発動して勝利', true), T('p8', '運命の導き', 'C', 'play', 'キャラPICKが時間切れ(ランダム)でも勝利', true),
  T('k100', '百連打', 'R', 'play', '100コンボに到達', true), T('k300', '止まらぬ指', 'E', 'play', '300コンボに到達', true),
];
const titleName = id => TITLES.find(t => t.id === id)?.name ?? null;

// ---- js/core/state.js



const SKEY = 'tb.settings.v1', GKEY = 'tb.guest.v1';
const DEFAULTS = {
  title: null, fx: true, bgm: 70, se: 70, theme: 'dark',
  hud: { ign: true, rank: true, title: true, streak: true },
  skillKeys: ['Shift+KeyD', 'Shift+KeyF'],
};

const read = (k, fallback) => { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 保存不可でも続行 */ } };

const saved = read(SKEY, {});
const mergeSettings = x => ({ ...DEFAULTS, ...x, hud: { ...DEFAULTS.hud, ...(x?.hud ?? {}) } });
const guestIgn = () => {
  let g = read(GKEY, null);
  if (!g) { g = 'Guest_' + (1000 + Math.floor(Math.random() * 9000)); write(GKEY, g); }
  return g;
};
// 開発用: URLに ?account=1 を付けると「登録済みアカウント」として動く(ランクマッチの確認用)
const registered = false;

const BLANK_PROFILE = { rank: '未配置', name: '未配置', lp: 0, tier: 0, div: 1, total: 0, placed: false, demo: null, pg: 0, gm: false, streak: 0, titles: [] };
const store = createStore({
  screen: 'menu', params: {}, mode: null, match: null, // mode: 'ranked' | 'normal'
  // ゲストの設定はこのブラウザに保存。ログイン中はアカウントごとにサーバーへ保存(称号はゲストでは装備なし)
  settings: { ...mergeSettings(saved), title: new URLSearchParams(location.search).has('unlock') ? saved.title ?? null : null },
  session: { guest: !registered, ign: registered ? (saved.ign || 'Player') : guestIgn(), online: navigator.onLine, server: false },
  // 開発用: ?unlock=1 で全称号を獲得済みとして表示(本来はサーバーが判定)
  profile: { ...BLANK_PROFILE, titles: new URLSearchParams(location.search).has('unlock') ? TITLES.map(t => t.id) : [] },
});

// サーバーから受け取った自分のプロフィール(ランク・称号など)を反映
const applyProfile = p => store.set(s => ({ profile: { ...s.profile, rank: p.rank, name: p.rankName, lp: p.lp, tier: p.tier, div: p.div, total: p.totalLp, placed: p.placed, demo: p.demo, pg: p.pg, gm: p.gm, streak: p.streak, titles: p.titles } }));
const applyUser = u => {
  store.set(s => ({ session: { ...s.session, guest: false, ign: u.ign, email: u.email } }));
  applyProfile(u);
  if (u.settings && Object.keys(u.settings).length) { // アカウントに保存されている設定に切り替える
    const settings = mergeSettings(u.settings);
    settings.title = u.titles.includes(settings.title) ? settings.title : null;
    store.set({ settings }); applySettings(settings);
  } else { store.set(s => ({ settings: { ...s.settings, title: null } })); syncNow(); } // 初めてのログイン: いまの設定をアカウントに保存
};
const clearUser = () => { // ログアウト: ゲストの設定に戻す(称号は装備なし)
  const g = { ...mergeSettings(read(SKEY, {})), title: null };
  store.set(s => ({ session: { ...s.session, guest: true, ign: guestIgn(), email: null }, profile: { ...BLANK_PROFILE }, settings: g }));
  applySettings(g);
};

function applySettings(s = store.get().settings) {
  const d = document.documentElement;
  d.dataset.theme = s.theme;
  d.dataset.fx = s.fx ? 'on' : 'off';
}
const equippedTitle = st => (st.profile.titles.includes(st.settings.title) ? st.settings.title : null); // 持っている称号だけを装備として扱う
const tokenOf = () => { try { return localStorage.getItem('tb.token'); } catch { return null; } };
let syncTimer = 0;
async function syncNow() { // ログイン中の設定をサーバー(アカウント)に保存
  clearTimeout(syncTimer);
  const { session, settings: x } = store.get();
  if (session.guest || location.protocol === 'file:') return;
  try {
    await fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tokenOf()}` },
      body: JSON.stringify({ fx: x.fx, bgm: x.bgm, se: x.se, theme: x.theme, hud: x.hud, skillKeys: x.skillKeys, title: x.title }) });
  } catch { /* 通信できないときは、次の変更でもう一度送る */ }
}
function saveSettings(patch) {
  const settings = { ...store.get().settings, ...patch };
  store.set({ settings });
  applySettings(settings);
  if (store.get().session.guest) write(SKEY, settings);
  else { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 500); }
}

const setOnline = online => store.set(s => ({ session: { ...s.session, online } }));
addEventListener('online', () => setOnline(true));
addEventListener('offline', () => setOnline(false));

// ---- js/core/router.js
// 画面 = { mount(el, ctx) => cleanup }。画面遷移はgo(id)だけ。


const screens = new Map();
let root = null, cleanup = null;

const registerScreens = obj => Object.entries(obj).forEach(([id, mod]) => screens.set(id, mod));

function go(id, params = {}) {
  const mod = screens.get(id);
  if (!mod) throw new Error(`未登録の画面: ${id}`);
  cleanup?.();

  const el = document.createElement('section');
  el.className = 'screen';
  el.dataset.screen = id;
  root.append(el);

}

// ---- js/core/auth.js
// アカウント(メール+パスワード)。サーバーのAPIを呼ぶ。Gmailなど任意のメールアドレスで登録できる
const IGN_RE = /^[A-Za-z0-9_.-]{3,16}$/;
const EMAIL_RE = /^[^\s@]{1,64}@[^\s@]{1,190}\.[^\s@]{2,}$/;
const NO_SERVER = 'サーバーに接続できません。サーバーを起動して、ブラウザで http://localhost:3000 を開いてください(ファイルを直接開いている間は、アカウントを使えません)';

function validate({ email = '', password = '', password2 = '', ign = '' }, register) {
  if (!EMAIL_RE.test(email.trim())) return 'メールアドレスの形式が正しくありません';
  if (register && !IGN_RE.test(ign)) return 'プレイヤー名は3〜16文字の英数字と _ - . だけ使えます';
  if (password.length < 8) return 'パスワードは8文字以上にしてください';
  if (register && password !== password2) return 'パスワードが一致しません';
  return '';
}
const getToken = () => { try { return localStorage.getItem('tb.token'); } catch { return null; } };
const setToken = t => { try { t ? localStorage.setItem('tb.token', t) : localStorage.removeItem('tb.token'); } catch { /* 無視 */ } };

async function api(path, method, body) {
  if (location.protocol === 'file:') return { error: NO_SERVER };
  try {
    const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(getToken() ? { Authorization: `Bearer ${getToken()}` } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json();
    return r.ok ? j : { error: j.error || 'エラーが発生しました', status: r.status };
  } catch { return { error: NO_SERVER }; }
}

const Auth = {
  async register({ email, password, ign }) { const r = await api('/api/register', 'POST', { email: email.trim(), password, ign }); if (r.token) setToken(r.token); return r.error ? { error: r.error } : { user: r.user }; },
  async login({ email, password }) { const r = await api('/api/login', 'POST', { email: email.trim(), password }); if (r.token) setToken(r.token); return r.error ? { error: r.error } : { user: r.user }; },
  async changeIgn(ign) { const r = await api('/api/ign', 'POST', { ign }); return r.error ? { error: r.error } : { user: r.user }; },
  async logout() { await api('/api/logout', 'POST', {}); setToken(null); },
  async restore() {
    if (!getToken()) return null;
    const r = await api('/api/me', 'GET');
    if (r.status === 401) setToken(null);
    return r.user ?? null;
  },
};
const restoreSession = () => Auth.restore();

// ---- js/net/conn.js
// サーバーとの通信(WebSocket)。ファイルを直接開いている場合(サーバーなし)は接続しない



const LISTENERS = new Map();
const LAST = {}; // 種類ごとの最新メッセージ(画面の切り替え中に届いたものを拾うため)
let sock = null, retry = 0, wanted = false, seqNo = 0, retryTimer = 0;
const emit = (type, m) => [...(LISTENERS.get(type) ?? [])].forEach(fn => fn(m));
const setServer = on => { if (store.get().session.server !== on) store.set(s => ({ session: { ...s.session, server: on } })); };

const conn = {
  get seq() { return seqNo; },
  get open() { return sock?.readyState === 1; },
  on(type, fn) { const set = LISTENERS.get(type) ?? new Set(); set.add(fn); LISTENERS.set(type, set); return () => set.delete(fn); },
  send(o) { if (sock?.readyState === 1) sock.send(JSON.stringify(o)); },
  connect() {
    if (location.protocol === 'file:') { setServer(false); return; }
    wanted = true; clearTimeout(retryTimer);
    if (sock && sock.readyState <= 1) return;
    const s = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    sock = s;
    s.onopen = () => {
      retry = 0;
      let token = null; try { token = localStorage.getItem('tb.token'); } catch { /* 無視 */ }
      s.send(JSON.stringify({ t: 'hello', token, guest: store.get().session.ign, device: isMobile() ? 'mobile' : 'pc' }));
    };
    s.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      m.seq = ++seqNo; LAST[m.t] = m;
      if (m.t === 'hello_ok') { setServer(true); if (m.user) applyUser(m.user); }
      else if (m.t === 'profile' && m.user) applyProfile(m.user);
      emit(m.t, m);
    };
    s.onclose = () => { setServer(false); emit('_close', {}); if (wanted && sock === s) retryTimer = setTimeout(() => conn.connect(), Math.min(8000, 800 * 2 ** retry++)); };
    s.onerror = () => {};
  },
  reconnect() { const old = sock; sock = null; if (old) { old.onclose = null; try { old.close(); } catch { /* 無視 */ } } conn.connect(); },
};

// ---- js/core/audio.js
// サウンド: 音声ファイルは使わず、WebAudioで効果音とBGMをその場で生成する。音量は設定のBGM/効果音に連動


let ctx = null, sfxBus = null, bgmBus = null, scene = null, want = null, timer = 0, step = 0, nextT = 0;
const midi = m => 440 * 2 ** ((m - 69) / 12);

function ensure() {
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  ctx = new AC();
  const comp = ctx.createDynamicsCompressor();
  sfxBus = ctx.createGain(); bgmBus = ctx.createGain();
  sfxBus.connect(comp); bgmBus.connect(comp); comp.connect(ctx.destination);
  applyVolume();
  return ctx;
}
function applyVolume() {
  if (!ctx) return;
  const s = store.get().settings;
  sfxBus.gain.value = (s.se / 100) ** 1.5 * 0.9;
  bgmBus.gain.value = (s.bgm / 100) ** 1.5 * 0.4;
}
function unlockAudio() { if (ensure()) { ctx.resume(); if (want && !scene) playBgm(want); } }

const tone = (f, { type = 'square', dur = 0.1, vol = 0.2, slide = 0, when = 0, bus = 'sfx' } = {}) => {
  if (!ctx || ctx.state !== 'running') return;
  const t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus === 'sfx' ? sfxBus : bgmBus); o.start(t); o.stop(t + dur + 0.02);
};
let noiseBuf = null;
const noise = ({ dur = 0.1, vol = 0.2, hp = 800, when = 0, bus = 'sfx' } = {}) => {
  if (!ctx || ctx.state !== 'running') return;
  if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = ctx.currentTime + when, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(bus === 'sfx' ? sfxBus : bgmBus); s.start(t); s.stop(t + dur + 0.02);
};
const arp = (notes, gap, o) => notes.forEach((n, i) => tone(n, { ...o, when: i * gap }));

const SFX = {
  key: () => tone(1250, { type: 'triangle', dur: 0.03, vol: 0.05 }),
  miss: () => tone(140, { type: 'sawtooth', dur: 0.16, vol: 0.16, slide: -70 }),
  hurt: () => tone(170, { type: 'sine', dur: 0.09, vol: 0.14, slide: -80 }),
  crit: () => { noise({ dur: 0.14, vol: 0.18, hp: 1800 }); tone(760, { type: 'sawtooth', dur: 0.2, vol: 0.14, slide: -460 }); },
  skill: () => { tone(280, { type: 'sawtooth', dur: 0.38, vol: 0.15, slide: 900 }); arp([523, 659, 784], 0.07, { type: 'triangle', dur: 0.3, vol: 0.14, when: 0 }); },
  combo: () => arp([523, 659, 784, 1047], 0.06, { type: 'square', dur: 0.12, vol: 0.09 }),
  heal: () => arp([1175, 1568, 2093], 0.07, { type: 'triangle', dur: 0.2, vol: 0.1 }),
  ko: () => { noise({ dur: 0.6, vol: 0.32, hp: 200 }); tone(95, { type: 'sawtooth', dur: 0.7, vol: 0.25, slide: -60 }); },
  count: () => tone(440, { dur: 0.16, vol: 0.14 }),
  go: () => { tone(880, { dur: 0.4, vol: 0.16 }); tone(1320, { type: 'triangle', dur: 0.4, vol: 0.1 }); },
  win: () => arp([523, 659, 784, 1047, 1319], 0.13, { type: 'square', dur: 0.28, vol: 0.12 }),
  lose: () => arp([392, 349, 311, 262], 0.22, { type: 'triangle', dur: 0.4, vol: 0.18 }),
  ui_move: () => tone(660, { dur: 0.035, vol: 0.05 }),
  ui_ok: () => arp([880, 1320], 0.06, { dur: 0.08, vol: 0.09 }),
  ui_back: () => tone(440, { dur: 0.1, vol: 0.08, slide: -120 }),
  ban: () => { tone(110, { type: 'square', dur: 0.2, vol: 0.2, slide: -60 }); noise({ dur: 0.08, vol: 0.12, hp: 500 }); },
  pick: () => arp([988, 1319], 0.07, { type: 'triangle', dur: 0.2, vol: 0.13 }),
  tick: () => tone(1000, { dur: 0.03, vol: 0.09 }),
  found: () => arp([523, 659, 784, 988], 0.09, { type: 'square', dur: 0.16, vol: 0.1 }),
  vs: () => { tone(120, { type: 'sawtooth', dur: 0.6, vol: 0.2, slide: 200 }); noise({ dur: 0.3, vol: 0.2, hp: 400 }); },
};
const sfx = name => { try { SFX[name]?.(); } catch { /* 音が出なくても進行に影響させない */ } };

// ---- BGM(コード進行からその場で演奏) ----
const SONGS = {
  menu: { bpm: 92, chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], bass: [45, 41, 36, 43], drive: false },
  battle: { bpm: 156, chords: [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 56, 59]], bass: [45, 41, 43, 40], drive: true },
};
function playStep(song, i, t) {
  const bar = Math.floor(i / 16) % 4, s = i % 16, ch = song.chords[bar], at = t - ctx.currentTime;
  const T = (f, o) => tone(f, { ...o, bus: 'bgm', when: at });
  if (!song.drive) {
    if (s % 8 === 0) T(midi(song.bass[bar]), { type: 'triangle', dur: 0.8, vol: 0.55 });
    if ([0, 3, 6, 8, 11, 14].includes(s)) T(midi(ch[(s * 7) % 3] + 12), { type: 'triangle', dur: 0.3, vol: 0.2 });
    if (s === 0 || s === 8) T(62, { type: 'sine', dur: 0.14, vol: 0.4, slide: -30 });
    if (s % 4 === 2) noise({ dur: 0.03, vol: 0.04, hp: 7000, bus: 'bgm', when: at });
  } else {
    if (s % 2 === 0) T(midi(song.bass[bar] + (s % 4 === 2 ? 12 : 0)), { type: 'sawtooth', dur: 0.12, vol: 0.26 });
    T(midi(ch[s % 3] + 12 * (1 + ((s >> 3) & 1))), { type: 'square', dur: 0.07, vol: 0.075 });
    if (s % 8 === 0 || s === 6) T(64, { type: 'sine', dur: 0.13, vol: 0.5, slide: -35 });
    if (s === 4 || s === 12) noise({ dur: 0.12, vol: 0.22, hp: 1500, bus: 'bgm', when: at });
    if (s % 2 === 1) noise({ dur: 0.02, vol: 0.05, hp: 8000, bus: 'bgm', when: at });
  }
}
function pump() {
  const song = SONGS[scene], dur = 60 / song.bpm / 4;
  while (nextT < ctx.currentTime + 0.18) { playStep(song, step++, nextT); nextT += dur; }
}
function playBgm(name) {
  want = name;
  if (!ctx || ctx.state !== 'running') return;
  clearInterval(timer); scene = name; step = 0; nextT = ctx.currentTime + 0.1;
  timer = setInterval(pump, 30);
}
function stopBgm() { want = null; scene = null; clearInterval(timer); }

const sceneFor = screen => (screen === 'battle' ? 'battle' : screen === 'vs' || screen === 'result' ? null : 'menu');
function initAudio() {
  const go = () => unlockAudio();
  addEventListener('pointerdown', go); addEventListener('keydown', go);
  let lastScreen = store.get().screen, lastVol = '';
  want = sceneFor(lastScreen);
  store.subscribe(s => {
    if (s.screen !== lastScreen) { lastScreen = s.screen; const w = sceneFor(s.screen); if (w !== scene) { w ? playBgm(w) : stopBgm(); } }
    const v = `${s.settings.bgm}/${s.settings.se}`; if (v !== lastVol) { lastVol = v; applyVolume(); }
  });
}

        <label>パスワード${reg ? '(8文字以上)' : ''}<input name="password" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}"></label>
        ${reg ? '<label>パスワード(確認)<input name="password2" type="password" autocomplete="new-password"></label>' : ''}
        <p class="am-err" role="alert">${esc(err)}</p>
        <div class="row"><button class="btn primary" type="submit" ${busy ? 'disabled' : ''}>${busy ? '通信中…' : reg ? '登録する' : 'ログイン'}</button><button class="btn" type="button" data-a="close">閉じる</button></div>
        ${reg ? '<p class="note">いまのゲストの戦績・称号・設定は、そのまま引き継がれます。</p>' : ''}
        <p class="note">Gmailなど、普段お使いのメールアドレスで登録できます(確認メールは送りません)。</p>
      </form></div>`;
    (modal.querySelector(err ? 'input[type=password]' : 'input'))?.focus();
  };
  const open = () => { modal.hidden = false; tab = 'login'; err = ''; paintModal(); };
  const close = () => { modal.hidden = true; busy = false; };

  host.addEventListener('click', async e => {
    const a = e.target.closest('[data-a]')?.dataset.a, t = e.target.closest('[data-tab]')?.dataset.tab;
    if (a === 'open') open();
    else if (a === 'close' || e.target === modal) close();
    else if (a === 'out') { await syncNow(); await Auth.logout(); clearUser(); conn.reconnect(); }
    else if (t) { tab = t; err = ''; paintModal(); }
  });
  host.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;
    vals = Object.fromEntries(new FormData(e.target)); vals.email = (vals.email ?? '').trim(); vals.ign = (vals.ign ?? '').trim();
    const reg = tab === 'register';
    err = validate(vals, reg);
    if (err) return paintModal();
    busy = true; err = ''; paintModal();
    const r = await (reg ? Auth.register(vals) : Auth.login(vals));
    busy = false;
    if (r.error) { err = r.error; return paintModal(); }
    applyUser(r.user); conn.reconnect(); vals = {}; close();
  });
  addEventListener('keydown', e => { // ダイアログ表示中のEscは、ダイアログだけを閉じる
    if (e.key === 'Escape' && !modal.hidden) { e.stopImmediatePropagation(); close(); }
  }, true);
  store.subscribe(paintBar);
  paintBar();
}

// ---- js/engine/rng.js
// 種(seed)つき乱数。サーバーとクライアントで同じ結果を出すために使う
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ---- js/engine/romaji.js
// ひらがな(読み)→ ローマ字入力の判定。si/shi, tu/tsu, hu/fu, n/nn, 促音の子音重ね などに対応
const BASE = {
  あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o',
  か: 'ka,ca', き: 'ki', く: 'ku,cu', け: 'ke', こ: 'ko,co',
  さ: 'sa', し: 'si,shi,ci', す: 'su', せ: 'se,ce', そ: 'so',
  た: 'ta', ち: 'ti,chi', つ: 'tu,tsu', て: 'te', と: 'to',
  な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no',
  は: 'ha', ひ: 'hi', ふ: 'hu,fu', へ: 'he', ほ: 'ho',
  ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo',
  や: 'ya', ゆ: 'yu', よ: 'yo',
  ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro',
  わ: 'wa', を: 'wo',
  が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go',
  ざ: 'za', じ: 'zi,ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo',
  だ: 'da', ぢ: 'di', づ: 'du', で: 'de', ど: 'do',
  ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo',
  ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po',
  ぁ: 'xa,la', ぃ: 'xi,li', ぅ: 'xu,lu', ぇ: 'xe,le', ぉ: 'xo,lo',
  ゃ: 'xya,lya', ゅ: 'xyu,lyu', ょ: 'xyo,lyo',
  ー: '-',
};
const COMBO = {
  ふぁ: 'fa', ふぃ: 'fi', ふぇ: 'fe', ふぉ: 'fo', てぃ: 'thi', でぃ: 'dhi',
  うぃ: 'wi', うぇ: 'we', しぇ: 'she', じぇ: 'je', ちぇ: 'che',
};
const YOUON = { き: 'ky', ぎ: 'gy', し: 'sy,sh', じ: 'zy,j,jy', ち: 'ty,ch,cy', ぢ: 'dy', に: 'ny', ひ: 'hy', び: 'by', ぴ: 'py', み: 'my', り: 'ry' };
for (const [k, pre] of Object.entries(YOUON)) {
  for (const [s, v] of Object.entries({ ゃ: 'a', ゅ: 'u', ょ: 'o' })) COMBO[k + s] = pre.split(',').map(p => p + v).join(',');
}

const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

function tokenize(reading, literal = false) {
  if (literal) return [...reading].map(c => ({ p: [c], k: c }));
  const s = toHira(reading), out = [];
  for (let i = 0; i < s.length; i++) {
    const two = s.slice(i, i + 2);
    if (COMBO[two]) { out.push({ p: COMBO[two].split(','), k: two }); i++; continue; }
    const c = s[i];
    if (c === 'っ') { out.push({ sok: true, k: 'っ' }); continue; }
    if (c === 'ん') { out.push({ nn: true, k: 'ん' }); continue; }
    if (BASE[c]) out.push({ p: BASE[c].split(','), k: c });
  }
  out.forEach((t, i) => {
    const nx = out[i + 1];
    if (t.sok) { // 促音: 次の音の子音を重ねる / xtu / ltu
      const letters = [];
      for (const q of nx?.p ?? []) if (!'aiueo-'.includes(q[0]) && !letters.includes(q[0])) letters.push(q[0]);
      t.p = [...letters, 'xtu', 'ltu'];
    } else if (t.nn) { // 「ん」: 次が母音・や行・語末なら nn が必要(な行の前は n でも nn でも可)
      const single = nx?.p && nx.p.every(q => !'aiueoy'.includes(q[0]));
      t.p = single ? ['n', 'nn'] : ['nn'];
    }
  });
  return out;
}

function createTyper(reading, literal = false) {
  const tk = tokenize(reading, literal);
  let i = 0, cur = '', hist = '', lock = null, alt = null;
  const pats = idx => (lock && lock.idx === idx ? tk[idx].p.filter(p => p.startsWith(lock.L)) : tk[idx].p);
  const longer = (idx, c) => pats(idx).some(p => p.length > c.length && p.startsWith(c));
  const finish = () => {
    if (tk[i].sok && cur.length === 1) lock = { idx: i + 1, L: cur };
    i++; cur = '';
    return i >= tk.length;
  };
  const settle = () => (pats(i).includes(cur) && !longer(i, cur) ? (finish() ? 'done' : 'ok') : 'ok');

  const step = ch => {
    if (pats(i).some(p => p.startsWith(cur + ch))) {
      // 「ん」+な行 で n を2回: 「ん=nn」とも「ん=n + な行の頭のn」とも読めるので、両方の可能性を持つ
      if (tk[i].nn && cur === 'n' && ch === 'n' && pats(i).includes('n') && i + 1 < tk.length && tk[i + 1].p?.every(q => q[0] === 'n')) {
        alt = { i: i + 1, cur: '', lock, hist: hist + ch };
        i++; cur = 'n'; hist += ch;
        return 'ok';
      }
      cur += ch; hist += ch;
      return settle();
    }
    if (cur && pats(i).includes(cur) && i + 1 < tk.length) { // 「n」で確定済みの「ん」から次の音へ
      const saved = { i, cur, lock };
      finish();
      if (pats(i).some(p => p.startsWith(ch))) { cur = ch; hist += ch; return settle(); }
      ({ i, cur, lock } = saved);
    }
    return 'miss';
  };

  return {
    // 戻り値: 'ok'(正しい打鍵) / 'miss' / 'done'(この打鍵で単語完了)
    press(ch) {
      if (i >= tk.length) return 'done';
      const saved = alt; alt = null;
      const r = step(ch);
      if (r !== 'miss' || !saved) return r;
      ({ i, cur, lock, hist } = saved);
      return step(ch);
    },
    isDone: () => i >= tk.length,
    // 表示用: typed=打ち終えた分 / rest=残りの標準的な打ち方
    view() {
      let rest = '';
      if (i < tk.length) {
        const p = pats(i).find(x => x.startsWith(cur)) ?? pats(i)[0];
        rest = p.slice(cur.length);
        let forced = tk[i].sok && p.length === 1 ? p : null;
        for (let j = i + 1; j < tk.length; j++) {
          const ps = forced ? tk[j].p.filter(q => q.startsWith(forced)) : tk[j].p;
          const q = ps[0] ?? tk[j].p[0];
          rest += q;
          forced = tk[j].sok && q.length === 1 ? q : null;
        }
      }
      return { typed: hist, rest, kanaDone: tk.slice(0, i).map(x => x.k).join(''), kanaRest: tk.slice(i).map(x => x.k).join('') };
    },
  };
}

// ---- js/engine/kana.js
// かな入力(スマホのフリック入力など)の判定。サーバーとブラウザで同じコードを使う
// 濁点・小文字・「っ」は、キーを押し直して変わる(か→が、や→ゃ)ので、変わる前の文字を打った段階は「途中」として扱う
const kanaHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const CYCLES = ['かが', 'きぎ', 'くぐ', 'けげ', 'こご', 'さざ', 'しじ', 'すず', 'せぜ', 'そぞ', 'ただ', 'ちぢ', 'つっづ', 'てで', 'とど',
  'はばぱ', 'ひびぴ', 'ふぶぷ', 'へべぺ', 'ほぼぽ', 'やゃ', 'ゆゅ', 'よょ', 'あぁ', 'いぃ', 'うぅゔ', 'えぇ', 'おぉ', 'わゎ'];
const LEAD = {}; // 目的の文字 → 途中で許す文字
for (const c of CYCLES) for (const t of c) LEAD[t] = [...c].filter(x => x !== t).join('');

const isKana = ch => /^[ぁ-ゖァ-ヶー]$/.test(ch);

function createKanaTyper(reading) {
  const target = kanaHira(reading).replace(/[\s、。,.]/g, '');
  let i = 0, pending = '';
  return {
    // 戻り値: 結果の配列 'ok'(1文字正解) / 'done'(語を打ち終えた) / 'pending'(変換の途中) / 'miss'
    // replace=true: 直前に打った文字が、濁点などで別の文字に置き換わった
    press(ch, replace = false) {
      ch = kanaHira(ch);
      if (i >= target.length) return ['done'];
      const want = target[i], out = [];
      if (!replace && pending) { out.push('miss'); pending = ''; } // 変換されないまま次を打った
      if (replace && !pending) return ['miss'];
      if (ch === want) { i++; pending = ''; out.push(i >= target.length ? 'done' : 'ok'); }
      else if ((LEAD[want] ?? '').includes(ch)) { pending = ch; out.push('pending'); }
      else { pending = ''; out.push('miss'); }
      return out;
    },
    isDone: () => i >= target.length,
    view: () => ({ typed: target.slice(0, i), rest: target.slice(i), pending }),
  };
}

// ---- js/engine/wordinput.js
// 1つの単語の入力(ローマ字 / かな)。最初に正しく打てた方式に固定され、途中で切り替えるとミスになる



function createWordInput(word) {
  const romaji = createTyper(word.r, !!word.lit), kana = word.lit ? null : createKanaTyper(word.r);
  let mode = null;
  return {
    // kind: 'r'=ローマ字 / 'k'=かな。戻り値は結果の配列('ok' / 'done' / 'pending' / 'miss')
    press(kind, ch, replace = false) {
      if (kind === 'k' && !kana) return []; // 英単語にかな入力はない
      if (mode && mode !== kind) return ['miss'];
      const res = kind === 'r' ? [romaji.press(ch)] : kana.press(ch, replace);
      if (!mode && res.some(x => x === 'ok' || x === 'done')) mode = kind;
      return res;
    },
    get mode() { return mode; },
    // 画面表示用: かなの進み具合と、ローマ字の残り
    view() {
      if (mode === 'k') { const v = kana.view(); return { kanaDone: v.typed, kanaRest: v.rest, typed: '', rest: '', pending: v.pending }; }
      return { ...romaji.view(), pending: '' };
    },
  };
}

// ---- js/engine/battle.js
// 1ラウンドの進行(UI非依存)。時間は step(dt) で進め、入力は hit / miss / skill で渡す。
// サーバー権威にする場合も、このファイルをそのままサーバー側で動かせる。

const R = RULES;

const clampN = (v, a, b) => Math.min(b, Math.max(a, v));
const otherSide = s => (s === 'p1' ? 'p2' : 'p1');

function createBattle({ chars, rng, duration = R.DURATION }) {
  const mk = c => ({ c, hp: c.hp, max: c.hp, combo: 0, gauge: 0, fx: [], hits: 0, miss: 0 });
  const P = { p1: mk(chars[0]), p2: mk(chars[1]) };
  let t = 0, over = null, events = [];

  const sum = (p, k) => p.fx.reduce((a, f) => a + (f.k === k && f.until > t ? f.v : 0), 0);
  const prod = (p, k) => p.fx.reduce((a, f) => a * (f.k === k && f.until > t ? f.v : 1), 1);
  const active = (p, k) => p.fx.some(f => f.k === k && f.until > t);
  const fxOf = p => [...new Set(p.fx.filter(f => f.until > t).map(f => f.k))];
  const pas = (p, k) => (p.c.passive?.k === k ? p.c.passive : null); // パッシブ(常時効果)
  const push = e => events.push({ t, ...e });
  const hurt = (s, amount) => { P[s].hp = Math.max(0, P[s].hp - amount); };
  const finish = (winner, reason) => { if (!over) { over = { winner, reason }; push({ type: 'end', winner, reason }); } };

  const judge = () => {
    if (over) return;
    const a = P.p1.hp <= 0, b = P.p2.hp <= 0;
    if (a && b) return finish('draw', 'ko');
    if (a) return finish('p2', 'ko');
    if (b) return finish('p1', 'ko');
    if (t >= duration) {
      const ra = P.p1.hp / P.p1.max, rb = P.p2.hp / P.p2.max;
      if (Math.abs(ra - rb) > 1e-9) return finish(ra > rb ? 'p1' : 'p2', 'time');   // HP割合
      if (P.p1.hits !== P.p2.hits) return finish(P.p1.hits > P.p2.hits ? 'p1' : 'p2', 'count'); // 正しく打てた文字数
      finish('draw', 'draw');
    }
  };

  return {
    hit(s, mult = 1) { // 正しい1打鍵(mult: スマホ入力のダメージ倍率など)
      if (over) return;
      const p = P[s], f = P[otherSide(s)];
      p.hits++; p.combo++;
      const bonus = Math.min(Math.floor(p.combo / (p.c.comboStep ?? R.COMBO_STEP)) * (p.c.comboBonus ?? R.COMBO_STEP_BONUS), p.c.comboCap ?? R.COMBO_CAP);
      const op = pas(p, 'opening'), rg = pas(p, 'rage'), cc = pas(p, 'critCombo'), ls = pas(p, 'lifesteal'), fg = pas(f, 'foeGauge');
      const passiveMul = (op && t < op.sec ? op.v : 1) * (rg && p.hp / p.max <= rg.hp ? rg.v : 1);
      const critRate = clampN(p.c.crit + sum(p, 'critUp') + (cc ? Math.min(Math.floor(p.combo / cc.per) * cc.v, cc.cap) : 0), 0, 1);
      const crit = rng() < critRate;
      const wd = pas(f, 'ward');
      const cut = clampN(f.c.def + sum(f, 'shield') + (wd ? wd.v : 0), 0, R.DEF_CAP);
      const dmg = p.c.atk * (1 + bonus) * (crit ? p.c.critMul : 1) * prod(p, 'dmg') * prod(p, 'atkDown') * passiveMul * (1 - cut) * mult;
      p.gauge = Math.min(R.GAUGE_MAX, p.gauge + R.GAUGE_PER_HIT * (1 + Math.min(p.combo, R.COMBO_GAUGE_FULL) / R.COMBO_GAUGE_FULL) * prod(p, 'gaugeMul') * (fg ? fg.v : 1));
      hurt(otherSide(s), dmg);
      if (ls) p.hp = Math.min(p.max, p.hp + dmg * ls.v);
      push({ type: 'hit', side: s, dmg, crit, combo: p.combo });
      judge();
    },
    miss(s) { // ミスタイプ: コンボ切れ+自傷
      if (over) return;
      const p = P[s], mc = pas(p, 'missCut'), cl = pas(p, 'comboLoss');
      p.miss++; p.combo = cl ? Math.max(0, p.combo - cl.n) : 0; // 武闘家はコンボが0に戻らず、決まった数だけ減る
      const self = active(p, 'guard') ? 0 : p.max * R.MISS_SELF_PCT * (mc ? mc.v : 1);
      if (self) hurt(s, self);
      push({ type: 'miss', side: s, self });
      judge();
    },
    skill(s, idx) { // 発動できたら true
      if (over) return false;
      const p = P[s], f = P[otherSide(s)], sk = p.c.skills[idx];
      if (!sk || p.gauge < sk.cost) return false;
      p.gauge -= sk.cost;
      for (const e of sk.fx) {
        const tgt = e.to === 'foe' ? f : p;
        if (e.t === 'burst') hurt(otherSide(s), f.max * e.pct);
        else if (e.t === 'heal') p.hp = Math.min(p.max, p.hp + p.max * e.pct);
        else if (e.t === 'buff') tgt.fx.push({ k: e.k, v: e.v, until: t + e.dur });
        else if (e.t === 'dot') f.fx.push({ k: 'dot', v: e.pct, until: t + e.dur });
        else if (e.t === 'gaugeCut') f.gauge *= e.v;
        else if (e.t === 'combo') { if (e.add !== undefined) p.combo += e.add; else tgt.combo = e.set; }
      }
      push({ type: 'skill', side: s, idx, name: sk.name });
      judge();
      return true;
    },
    step(dt) { // 時間を進める(継続ダメージ・再生・効果の期限切れ・時間切れ判定)
      if (over) return;
      const before = t;
      t += dt;
      for (const s of ['p1', 'p2']) {
        const p = P[s], rgn = pas(p, 'regen');
        const dot = p.fx.reduce((a, f) => a + (f.k === 'dot' && f.until > before ? f.v : 0), 0);
        if (dot) hurt(s, p.max * dot * dt);
        if (rgn && p.hp > 0) p.hp = Math.min(p.max, p.hp + p.max * rgn.pct * dt);
        p.fx = p.fx.filter(f => f.until > t);
      }
      judge();
    },
    surrender(s) { finish(otherSide(s), 'surrender'); },
    drain() { const e = events; events = []; return e; },
    result: () => over,
    state: () => ({
      t, remaining: Math.max(0, duration - t),
      p1: { hp: P.p1.hp, max: P.p1.max, combo: P.p1.combo, gauge: P.p1.gauge, hits: P.p1.hits, miss: P.p1.miss, fx: fxOf(P.p1) },
      p2: { hp: P.p2.hp, max: P.p2.max, combo: P.p2.combo, gauge: P.p2.gauge, hits: P.p2.hits, miss: P.p2.miss, fx: fxOf(P.p2) },
    }),
  };
}

// ---- js/engine/bot.js
// CPU。CPM・正確率・スキルの使い方(none / ready=溜まり次第 / random)で動く
function createBot({ cpm, accuracy, skillMode = 'ready', rng }) {
  let carry = 0, nextSkill = 0;
  return {
    step(dt, battle, side) {
      carry += (cpm / 60) * dt;
      const n = Math.floor(carry);
      carry -= n;
      for (let k = 0; k < n; k++) (rng() < accuracy ? battle.hit(side) : battle.miss(side));
      if (skillMode === 'ready') { if (battle.skill(side, nextSkill)) nextSkill = 1 - nextSkill; }
      else if (skillMode === 'random' && rng() < 0.03) battle.skill(side, rng() < 0.5 ? 0 : 1);
    },
  };
}

  { hi: '#fff1c2', mid: '#ff5b4a', lo: '#7d0f20', glow: '#ff8a5a' },
];
const UNR = { hi: '#e3e7f5', mid: '#8d95b4', lo: '#3f4766', glow: '#aab2d4' };
const rankColor = ({ placed, tier, gm }) => (!placed ? UNR : PAL[gm ? 6 : Math.min(tier, 5)]).mid;

const O = 'stroke="#10122e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const SHIELD = 'M50 4 L88 17 L86 60 Q84 87 50 104 Q16 87 14 60 L12 17 Z';
const PLATE = 'M50 14 L78 24 L76.5 59 Q75 80 50 93 Q25 80 23.5 59 L22 24 Z';
const WING = 'M14 28 C-6 20 -18 34 -15 56 L-4 48 L-7 64 L7 55 L6 71 L16 57 Z';
const star = (cx, cy, R, r) => Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + (i * Math.PI) / 5, k = i % 2 ? r : R; return `${(cx + k * Math.cos(a)).toFixed(1)},${(cy + k * Math.sin(a)).toFixed(1)}`; }).join(' ');
const grad = (u, n, a, b, c) => `<linearGradient id="${u}${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;

// 中央の紋章(ティアごと)
function emblem(t, u, P) {
  const m = `url(#${u}m)`, f = `fill="${m}" ${O}`;
  if (t === 0) return `<path d="M50 34 L69 58 L60 58 L50 46 L40 58 L31 58 Z" ${f}/><path d="M50 52 L69 76 L60 76 L50 64 L40 76 L31 76 Z" ${f} opacity=".55"/>`;

  if (t === 4) return `<polygon points="50,32 70,46 70,66 50,84 30,66 30,46" ${f}/><polygon points="38,46 62,46 70,56 30,56" fill="${P.hi}" opacity=".9" ${O}/><path d="M30 56 L50 84 L70 56 M41 56 L50 84 L59 56 M50 32 L38 46 M50 32 L62 46" fill="none" stroke="${P.hi}" stroke-width="1.6" opacity=".9"/>`;
