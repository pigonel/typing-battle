}

// info = { placed, tier(0..5), div(1..3), gm }
function rankIcon(info = {}, uid = 'ri') {
  const { placed = false, tier = 0, div = 1, gm = false } = info;
  const t = !placed ? -1 : gm ? 6 : Math.min(tier, 5), P = t < 0 ? UNR : PAL[t], u = `${uid}${t}`;
  const wings = t >= 3 ? `<g class="ri-wing"><path d="${WING}" fill="url(#${u}w)" ${O}/><path d="${WING}" transform="translate(100 0) scale(-1 1)" fill="url(#${u}w)" ${O}/></g>` : '';
  const big = t >= 5 ? `<g transform="translate(50 56) scale(1.22) translate(-50 -56)" class="ri-wing"><path d="${WING}" fill="url(#${u}w)" ${O}/><path d="${WING}" transform="translate(100 0) scale(-1 1)" fill="url(#${u}w)" ${O}/></g>` : '';
  const horns = t >= 5 ? `<path d="M26 12 L18 -3 L36 8 Z M74 12 L82 -3 L64 8 Z" fill="url(#${u}m)" ${O}/>` : '';
  const halo = t === 6 ? `<ellipse cx="50" cy="-2" rx="22" ry="6" fill="none" stroke="#ffd14a" stroke-width="3.5"/>` : '';
  const rivets = t === 0 ? '<circle cx="24" cy="27" r="2.4" fill="#ffe2c4"/><circle cx="76" cy="27" r="2.4" fill="#ffe2c4"/>' : '';
  const gem = t >= 2 && t < 5 ? `<circle cx="50" cy="9" r="4.4" fill="${P.hi}" ${O}/>` : '';
  const sp = t === 4 ? sparkle(8, 20, 6, 0) + sparkle(94, 40, 5, 0.9) + sparkle(78, 4, 4.5, 1.6) : t === 6 ? sparkle(10, 14, 5, 0) + sparkle(92, 30, 6, 0.8) : t === 5 ? sparkle(88, 12, 4.5, 0.5) : '';
  const pips = t < 0 || t >= 5 ? '' : [38, 50, 62].map((x, i) => `<path d="M${x} 108 l5 5.5 l-5 5.5 l-5 -5.5 z" fill="${i < div ? P.hi : '#10122e66'}" stroke="#10122e" stroke-width="2" stroke-linejoin="round"/>`).join('');
  const q = t < 0 ? '<text x="50" y="72" text-anchor="middle" font-size="46" font-weight="900" fill="#e3e7f5" stroke="#10122e" stroke-width="2.5" paint-order="stroke" font-family="sans-serif">?</text>' : '';
  return `<svg class="ri ${t >= 5 ? 'hot' : ''}" viewBox="-30 -14 160 142" role="img" aria-label="${t < 0 ? '未配置' : t === 6 ? 'グランドマスター' : `${TIER_NAMES[t]}${t < 5 ? div : ''}`}">
    <defs>${grad(u, 'm', P.hi, P.mid, P.lo)}${grad(u, 'p', P.lo, P.mid, P.hi)}${grad(u, 'w', P.hi, P.mid, P.lo)}<filter id="${u}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs>
    ${t >= 3 ? `<ellipse class="ri-glow" cx="50" cy="56" rx="46" ry="48" fill="${P.glow}" opacity=".5" filter="url(#${u}b)"/>` : ''}
    ${big || wings}${halo}${horns}
    <path d="${SHIELD}" fill="url(#${u}m)" ${O}/>
    <path d="${PLATE}" fill="url(#${u}p)" ${O}/>
    <path d="M50 14 L78 24 L76.5 40 Q50 34 23.5 40 L22 24 Z" fill="#fff" opacity=".18"/>
    ${rivets}${gem}${t < 0 ? q : emblem(t, u, P)}${sp}${pips}
  </svg>`;
}

// 「ゴールド2」「マスター」「グランドマスター」のような名前から、アイコン用の情報を作る
function parseRank(name = '') {
  if (name.startsWith('グランドマスター')) return { placed: true, tier: 5, div: 0, gm: true };
  if (name.startsWith('マスター')) return { placed: true, tier: 5, div: 0, gm: false };
  const i = TIER_NAMES.findIndex(n => n !== 'マスター' && name.startsWith(n));
  return i < 0 ? { placed: false, tier: 0, div: 1, gm: false } : { placed: true, tier: i, div: Math.min(3, Math.max(1, +name.slice(TIER_NAMES[i].length, TIER_NAMES[i].length + 1) || 1)), gm: false };
}

// ---- js/screens/battle_fx.js
// バトル画面の演出(ヒット・スキル・オーラ・KO)。見た目だけを担当し、勝敗や数値には関わらない。


const POS = { p1: { x: 18, y: 56 }, p2: { x: 82, y: 56 } }; // ステージ上のキャラ中心(%)
const other = s => (s === 'p1' ? 'p2' : 'p1');
const rnd = (a, b) => a + Math.random() * (b - a);
const AURAS = ['dmg', 'shield', 'critUp', 'gaugeMul', 'guard', 'atkDown', 'dot', 'open', 'rage'];
const BUFF_COLOR = { dmg: '#ff8a3a', shield: '#6bd0ff', critUp: '#ffe34d', gaugeMul: '#6beaff', guard: '#ffffff', atkDown: '#9a6bff' };
const BUFF_LABEL = { dmg: '攻撃UP', shield: '防御UP', critUp: '会心UP', gaugeMul: 'ゲージUP', guard: '自傷無効', atkDown: '攻撃DOWN' };

function createFx({ arena, stage, fighters, chars, banner, chips, on }) {
  const layer = stage.querySelector('.fxl');
  let live = 0, timers = [];
  const after = (fn, ms) => timers.push(setTimeout(fn, ms));

  const spawn = (cls, x, y, css = {}) => {
    if (live > 150) return null;
    const d = document.createElement('i');
    d.className = cls; d.style.left = `${x}%`; d.style.top = `${y}%`; Object.assign(d.style, css);
    layer.append(d); live++;
    return d;
  };
  const play = (d, frames, opt) => {
    if (!d) return;
    d.animate(frames, { fill: 'forwards', ...opt }).onfinish = () => { d.remove(); live--; };
  };
  const burst = (side, { n = 8, color = '#fff', dist = [30, 90], size = [4, 9], life = 520, grav = 30 } = {}) => {
    const p = POS[side];
    for (let k = 0; k < n; k++) {
      const a = rnd(0, Math.PI * 2), r = rnd(dist[0], dist[1]), s = rnd(size[0], size[1]);
      const d = spawn('pt', p.x + rnd(-3, 3), p.y + rnd(-12, 12), { width: `${s}px`, height: `${s}px`, background: color, color });
      play(d, [{ transform: 'translate(-50%,-50%)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r + grav}px)) scale(.2)`, opacity: 0 }], { duration: life * rnd(0.7, 1.2), easing: 'ease-out' });
    }
  };
  const rise = (side, glyph, color, n = 8) => {
    const p = POS[side];
    for (let k = 0; k < n; k++) {
      const d = spawn('glyph', p.x + rnd(-8, 8), p.y + rnd(0, 22), { color, fontSize: `${rnd(16, 28)}px` });
      if (d) d.textContent = glyph;
      play(d, [{ transform: 'translate(-50%,0)', opacity: 0 }, { transform: 'translate(-50%,-30px)', opacity: 1, offset: 0.2 }, { transform: 'translate(-50%,-130px)', opacity: 0 }], { duration: 1000 + k * 40, delay: k * 55, easing: 'ease-out' });
    }
  };
  const ring = (side, color, big = 1) => {
    const p = POS[side];
    play(spawn('ring', p.x, p.y, { borderColor: color, boxShadow: `0 0 18px ${color}` }), [{ transform: 'translate(-50%,-50%) scale(.2)', opacity: 0.95 }, { transform: `translate(-50%,-50%) scale(${2.8 * big})`, opacity: 0 }], { duration: 560, easing: 'ease-out' });
  };
  const slash = (side, color, long = 1) => {
    const p = POS[side];
    play(spawn('slash', p.x + rnd(-3, 3), p.y + rnd(-10, 10), { background: `linear-gradient(90deg,transparent,${color},transparent)`, width: `${170 * long}px` }),
      [{ transform: `translate(-50%,-50%) rotate(${rnd(-40, 40)}deg) scaleX(.2)`, opacity: 1 }, { transform: `translate(-50%,-50%) rotate(${rnd(-40, 40)}deg) scaleX(1)`, opacity: 0 }], { duration: 220, easing: 'ease-out' });
  };
  const pop = (side, text, cls = '', dy = 0) => {
    const p = POS[side], d = spawn(`pop ${cls}`, p.x, p.y - 18 + dy);
    if (d) d.textContent = text;
    play(d, [{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 0 }, { transform: 'translate(-50%,-80%) scale(1.15)', opacity: 1, offset: 0.25 }, { transform: 'translate(-50%,-130%) scale(1)', opacity: 0 }], { duration: 1000, easing: 'ease-out' });
  };
  const wash = (color, a = 0.3, ms = 240) => play(spawn('wash', 0, 0, { background: color }), [{ opacity: a }, { opacity: 0 }], { duration: ms });
  const shake = (amp = 6, ms = 160) => arena.animate([{ transform: `translate(${-amp}px,${amp / 2}px)` }, { transform: `translate(${amp}px,${-amp / 2}px)` }, { transform: `translate(${-amp / 2}px,0)` }, { transform: 'none' }], { duration: ms });
  const hurt = (side, mul = 1) => fighters[side].animate([{ transform: 'translateX(0)', filter: 'brightness(2.2)' }, { transform: `translateX(${(side === 'p1' ? -1 : 1) * 9 * mul}px)`, filter: 'brightness(1.3)' }, { transform: 'translateX(0)', filter: 'none' }], { duration: 110 + 60 * mul });
  const beam = (side, color) => {
    const a = POS[side], b = POS[other(side)], left = Math.min(a.x, b.x) + 6;
    const d = spawn('beam', left, a.y, { width: `${Math.abs(a.x - b.x) - 12}%`, background: `linear-gradient(${side === 'p1' ? 90 : 270}deg,transparent,${color} 40%,#fff)`, transformOrigin: side === 'p1' ? 'left center' : 'right center', boxShadow: `0 0 30px ${color}` });
    play(d, [{ transform: 'translateY(-50%) scaleX(0)', opacity: 1 }, { transform: 'translateY(-50%) scaleX(1)', opacity: 1, offset: 0.35 }, { transform: 'translateY(-50%) scaleX(1)', opacity: 0 }], { duration: 560, easing: 'ease-out' });
    after(() => { const t = other(side); ring(t, color, 1.4); burst(t, { n: 24, color, dist: [40, 150], size: [5, 12], life: 650 }); slash(t, '#fff', 1.8); shake(9, 220); wash(color, 0.32, 280); hurt(t, 2); }, 190);
  };
  const cutin = (side, skill, ch) => {
    const el = document.createElement('div');
    el.className = `cutin ${side === 'p1' ? 'l' : 'r'}`; el.style.setProperty('--c', ACCENT[ch.id]);
    el.innerHTML = `<div class="ci-art">${charArt(ch)}</div><div class="ci-txt"><small>${ch.name}</small><b>${skill.name}</b></div>`;
    arena.append(el);
    const dir = side === 'p1' ? -1 : 1;
    el.animate([{ transform: `translateX(${dir * 105}%)`, opacity: 0 }, { transform: 'translateX(0)', opacity: 1, offset: 0.16 }, { transform: 'translateX(0)', opacity: 1, offset: 0.76 }, { transform: `translateX(${-dir * 30}%)`, opacity: 0 }], { duration: 950, easing: 'ease-out' }).onfinish = () => el.remove();
  };

  const SKILL_FX = {
    burst: (side, e, ch) => beam(side, ACCENT[ch.id]),
    heal: side => { rise(side, '✚', '#6dffa0', 9); ring(side, '#6dffa0'); wash('#3dff8a', 0.16, 360); },
    buff: (side, e) => {
      const t = e.to === 'foe' ? other(side) : side, c = BUFF_COLOR[e.k] ?? '#fff';
      ring(t, c); burst(t, { n: 14, color: c, dist: [30, 100], life: 700, grav: -30 }); pop(t, BUFF_LABEL[e.k] ?? '', 'buff', 4);
      if (e.k === 'critUp') for (let k = 0; k < 3; k++) after(() => slash(t, '#ffe34d', 1.3), k * 90);
    },
    dot: side => { rise(other(side), '●', '#7ee06a', 8); pop(other(side), '継続ダメージ', 'buff', 4); },
    gaugeCut: side => { burst(other(side), { n: 14, color: '#6beaff', dist: [30, 90] }); pop(other(side), 'ゲージ減少', 'buff', 4); },
    combo: (side, e) => (e.add !== undefined ? pop(side, `+${e.add} COMBO`, 'buff', 4) : pop(other(side), 'COMBO BREAK', 'buff', 4)),
  };

  return {
    hit(side, e) {
      if (!on) return;
      const def = other(side), crit = e.crit;
      fighters[side].animate([{ transform: 'translateX(0)' }, { transform: `translateX(${(side === 'p1' ? 1 : -1) * (crit ? 20 : 12)}px)` }, { transform: 'translateX(0)' }], { duration: crit ? 130 : 90 });
      hurt(def, crit ? 1.6 : 1);
      burst(def, { n: crit ? 12 : 4, color: crit ? '#ffd23f' : '#fff', dist: crit ? [30, 110] : [14, 46], size: [3, crit ? 9 : 6], life: crit ? 560 : 320 });
      if (crit) { slash(def, '#ffd23f', 1.6); shake(4, 120); } else if (Math.random() < 0.35) slash(def, '#fff', 0.8);
    },
    combo(side, n) {
      if (!on) return;
      pop(side, `${n} COMBO!`, 'combo'); ring(side, '#ffd23f', 0.8);
    },
    skill(side, skill, ch) {
      if (!on) return;
      cutin(side, skill, ch);
      after(() => skill.fx.forEach(e => SKILL_FX[e.t]?.(side, e, ch)), 250);
    },
    auras(s) {
      ['p1', 'p2'].forEach((side, k) => {
        const p = s[side], ps = chars[side].passive, set = new Set(p.fx);
        if (ps?.k === 'opening' && s.t < ps.sec) set.add('open');
        if (ps?.k === 'rage' && p.hp / p.max <= ps.hp) set.add('rage');
        AURAS.forEach(a => fighters[side].classList.toggle(`a-${a}`, on && set.has(a)));
        chips[k]?.classList.toggle('on', set.has('open') || set.has('rage'));
      });
    },
    // 決着の演出。戻り値=結果表示までの待ち時間(ms)
    end(e) {
      if (!on) return 0;
      const loser = e.winner === 'p1' ? 'p2' : e.winner === 'p2' ? 'p1' : null, win = loser && other(loser);
      const say = (txt, ms = 1200) => { banner.textContent = txt; banner.classList.remove('go'); banner.animate([{ transform: 'scale(2.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 260, easing: 'ease-out' }); return ms; };
      if (e.reason === 'ko' && loser) {
        wash('#fff', 0.85, 520); shake(11, 320); burst(loser, { n: 36, color: '#ffd23f', dist: [60, 190], size: [5, 13], life: 800 });
        fighters[loser].animate([{ transform: 'none', opacity: 1, filter: 'none' }, { transform: `translateX(${loser === 'p1' ? -34 : 34}px) translateY(34px) rotate(${loser === 'p1' ? -14 : 14}deg)`, opacity: 0.35, filter: 'grayscale(1)' }], { duration: 750, fill: 'forwards', easing: 'ease-out' });
        fighters[win].animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-26px)' }, { transform: 'translateY(0)' }], { duration: 520, iterations: 2, delay: 500 });
        return say('K.O.!', 1800);
      }
      if (e.reason === 'time') return say('TIME UP', 1400);
      return 0;
    },
    reset() {
      timers.forEach(clearTimeout); timers = [];
      Object.values(fighters).forEach(f => f.getAnimations().forEach(a => a.cancel()));
      layer.innerHTML = ''; live = 0;
      arena.querySelectorAll('.cutin').forEach(c => c.remove());
    },
  };
}

// ---- js/screens/menu.js






const reason = (it, { session }) =>
  it.needs?.includes('online') && !session.server ? 'サーバーに接続できません(サーバーを起動して http://localhost:3000 を開いてください)'
  : it.needs?.includes('account') && session.guest ? 'アカウント登録が必要です(画面左上のボタンから登録できます)'
  : '';

const menuScreen = {
  mount(el, { store, go }) {
    el.innerHTML = `
      <header class="hud" aria-label="プレイヤー情報"></header>
      <div class="menu">
        <nav class="menu-list" aria-label="メインメニュー">${MENU_ITEMS.map((it, i) =>
          `<button class="menu-item" data-i="${i}"><span class="jp">${it.label}</span><span class="en">${it.en}</span></button>`).join('')}</nav>
        <aside class="preview" aria-live="polite"></aside>
      </div>`;
    const $ = q => el.querySelector(q), btns = [...el.querySelectorAll('.menu-item')];
    let active = 0;

    const paintHud = () => {
      const { settings: s, session, profile: p } = store.get();
      const guest = session.guest, info = guest ? { placed: false } : { placed: p.placed, tier: p.tier, div: p.div, gm: p.gm };
      let name, total, pct, gtxt, tag = '';
      if (guest) { name = 'ゲスト'; total = '―'; pct = 0; gtxt = 'ログインして配置戦を行うと、ランクが付きます'; }
      else if (!p.placed) { name = '未配置'; total = '―'; pct = (p.pg / 5) * 100; gtxt = `配置戦 ${p.pg} / 5`; }
      else if (p.tier >= 5) { name = p.gm ? 'グランドマスター' : 'マスター'; total = p.total; pct = p.gm ? 100 : Math.min(100, (p.lp / 200) * 100); gtxt = p.gm ? `${p.lp} LP` : `${p.lp} LP(グランドマスターまで あと${Math.max(0, 200 - p.lp)}LP)`; }
      else { name = `${TIER_NAMES[p.tier]}${p.div}`; total = p.total; pct = p.lp; gtxt = `${p.lp} / 100 LP`; }
      if (!guest && p.demo) tag = `降格戦 ${p.demo.w}勝${p.demo.l}敗`;
      const card = s.hud.rank ? `<div class="rk" style="--rc:${rankColor(info)}">
        <div class="rk-icon">${rankIcon(info, 'hud')}</div>
        <div class="rk-body"><div class="rk-top"><span class="rk-name">${esc(name)}</span>${tag ? `<span class="rk-tag">${esc(tag)}</span>` : ''}</div>
          <div class="rk-total">総合LP <b>${esc(total)}</b></div>
          <div class="rk-gauge ${!guest && !p.placed ? 'seg' : ''}"><i style="width:${pct}%"></i><span>${esc(gtxt)}</span></div></div></div>` : '';
      const chips = [
        s.hud.ign && ['プレイヤー', session.ign],
        s.hud.title && ['称号', titleName(equippedTitle(store.get())) ?? 'なし'],
        s.hud.streak && ['連勝', `${p.streak}`],
      ].filter(Boolean).map(([k, v]) => `<div class="chip"><small>${k}</small><b>${esc(v)}</b></div>`).join('');
      $('.hud').innerHTML = `${card}<div class="chips">${chips}</div>`;
    };
    const paintList = () => btns.forEach((b, i) => {
      const off = !!reason(MENU_ITEMS[i], store.get());
      b.setAttribute('aria-disabled', off);
      b.classList.toggle('is-off', off);
      b.classList.toggle('is-active', i === active);
    });
    const paintPreview = () => {
      const it = MENU_ITEMS[active], r = reason(it, store.get());
      $('.preview').innerHTML = `<h2>${it.label}</h2><p>${it.desc}</p>
        <ul>${it.points.map(p => `<li>${p}</li>`).join('')}</ul>${r ? `<p class="warn">${r}</p>` : ''}`;
    };
    const paint = () => { paintHud(); paintList(); paintPreview(); };

    el.addEventListener('focusin', e => { const b = e.target.closest('.menu-item'); if (b) { active = +b.dataset.i; paint(); } });
    el.addEventListener('mouseover', e => { const b = e.target.closest('.menu-item'); if (b && document.activeElement !== b) b.focus(); });
    el.addEventListener('click', e => {
      const b = e.target.closest('.menu-item'); if (!b) return;
      const it = MENU_ITEMS[+b.dataset.i];
      if (reason(it, store.get())) return;
      store.set({ mode: it.mode ?? null });
      go(it.screen);
    });
    el.addEventListener('keydown', e => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      btns[(active + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length].focus();
    });

    paint();
    btns[0].focus();
    return store.subscribe(paint);
  },
};

// ---- js/screens/settings.js






const HUD = [['ign', 'プレイヤー名'], ['rank', 'ランクとLP'], ['title', '装備中の称号'], ['streak', '連勝数']];
const MODS = ['ShiftLeft', 'ShiftRight', 'AltLeft', 'AltRight', 'ControlLeft', 'ControlRight', 'MetaLeft', 'MetaRight'];
const fmt = c => c.split('+').map(p => p.replace(/^(Key|Digit)/, '')).join(' + ');

const settingsScreen = {
  mount(el, { store, go }) {
    const { settings: s, session } = store.get();
    el.innerHTML = `
      <h1>設定</h1>
      <div class="panel form">
        <label class="field"><span>プレイヤー名</span>
          <input id="ign" maxlength="16" value="${esc(session.ign)}" ${session.guest ? 'disabled' : ''}>
          <small id="ign-msg">${session.guest ? 'ゲストは変更できません(アカウント登録後に変更できます)' : '3〜16文字の英数字と _ - . が使えます'}</small></label>
        <label class="field"><span>BGM音量 <output>${s.bgm}</output></span><input type="range" id="bgm" min="0" max="100" value="${s.bgm}"></label>
        <label class="field"><span>効果音の音量 <output>${s.se}</output></span><input type="range" id="se" min="0" max="100" value="${s.se}"></label>
        <label class="field"><span>演出・カットイン</span><select id="fx"><option value="1">ON</option><option value="0">OFF</option></select></label>
        <label class="field"><span>テーマ</span><select id="theme"><option value="dark">ダーク</option><option value="light">ライト</option></select></label>
        <fieldset class="field"><legend>メニュー上部に表示する項目</legend>${HUD.map(([k, t]) =>
          `<label><input type="checkbox" data-hud="${k}" ${s.hud[k] ? 'checked' : ''}>${t}</label>`).join('')}</fieldset>
        ${isMobile() ? '<p class="note">スキルは、画面下のスキルボタンをタップして使います。</p>' : `<div class="field"><span>スキルキー</span>
          <div class="row">${[0, 1].map(i => `<button class="btn" data-key="${i}"></button>`).join('')}</div>
          <small id="key-msg">ボタンを押してから、Shift または Alt と組み合わせたキーを押します</small></div>`}
      </div>
      <div class="row"><button class="btn primary" id="back">メニューへ戻る</button></div>`;
    const $ = q => el.querySelector(q);
    $('#fx').value = s.fx ? '1' : '0';
    $('#theme').value = s.theme;
    let rebind = null;
    const paintKeys = () => el.querySelectorAll('[data-key]').forEach(b => {
      const i = +b.dataset.key;
      b.textContent = `スキル${i + 1}: ${fmt(store.get().settings.skillKeys[i])}`;
    });
    paintKeys();

    el.addEventListener('input', e => {
      const t = e.target; if (t.type !== 'range') return;
      t.previousElementSibling.querySelector('output').textContent = t.value;
      saveSettings({ [t.id]: +t.value });
      if (t.id === 'se') sfx('ui_ok');
    });
    el.addEventListener('change', async e => {
      const t = e.target, cur = store.get().settings;
      if (t.id === 'fx') saveSettings({ fx: t.value === '1' });
      else if (t.id === 'theme') saveSettings({ theme: t.value });
      else if (t.dataset.hud) saveSettings({ hud: { ...cur.hud, [t.dataset.hud]: t.checked } });
      else if (t.id === 'ign') {
        const r = await Auth.changeIgn(t.value.trim());
        if (r.error) $('#ign-msg').textContent = r.error;
        else { store.set(st => ({ session: { ...st.session, ign: r.user.ign } })); applyProfile(r.user); $('#ign-msg').textContent = '変更しました(アカウントに保存されました)'; }
      }
    });
    el.addEventListener('click', e => {
      if (e.target.id === 'back') return go('menu');
      const b = e.target.closest('[data-key]'); if (!b) return;
      rebind = +b.dataset.key;
      b.textContent = 'キーを押してください(Escで中止)';
    });

    const onKey = e => {
      if (rebind === null) { if (e.key === 'Escape') go('menu'); return; }
      e.preventDefault();
      if (MODS.includes(e.code)) return;
      const msg = $('#key-msg'), keys = [...store.get().settings.skillKeys];
      if (e.code !== 'Escape') {
        const combo = `${e.altKey ? 'Alt+' : ''}${e.shiftKey ? 'Shift+' : ''}${e.code}`;
        if (!(e.shiftKey || e.altKey) || e.ctrlKey || e.metaKey) { msg.textContent = 'Shift または Alt と組み合わせてください'; return; }
        if (keys.some((k, i) => i !== rebind && k === combo)) { msg.textContent = 'もう一方のスキルと同じキーです'; return; }
        keys[rebind] = combo;
        saveSettings({ skillKeys: keys });
        msg.textContent = '変更しました';
      }
      rebind = null;
      paintKeys();
    };
    addEventListener('keydown', onKey, true);
    return () => removeEventListener('keydown', onKey, true);
  },
};

// ---- js/screens/training.js





const TRAIN_DEFAULT = { me: 'thief', foe: 'golem', format: 'daily', preset: 'gold', cpm: 220, acc: 94, skill: 'ready', limit: 60, dummy: false };
const SKILL_MODES = [['none', '使わない'], ['ready', '溜まり次第'], ['random', 'ランダム']];
const pct = v => `${Math.round(v * 100)}%`;

const trainingScreen = {
  mount(el, { store, go }) {
    const cfg = { ...TRAIN_DEFAULT, ...(store.get().trainingCfg ?? {}) };
    const save = () => store.set({ trainingCfg: { ...cfg } });
    const seg = (name, items, cur) => `<div class="seg" data-seg="${name}">${items.map(([v, t]) => `<button data-v="${v}" aria-pressed="${String(v) === String(cur)}">${t}</button>`).join('')}</div>`;

    const draw = () => {
      const me = charById(cfg.me);
      el.innerHTML = `
        <h1>トレーニング</h1>
        <div class="tr-grid">
          <div class="panel">
            <div class="field"><span>自分のキャラ</span></div>
            <div class="cards" style="margin-top:8px">${CHARACTERS.map(c => `<button class="card" data-me="${c.id}" aria-pressed="${c.id === cfg.me}">${charArt(c)}<b>${c.name}</b><small>${c.role}</small></button>`).join('')}</div>
            <div class="detail"><b>${me.name}</b>(${me.role}) HP ${me.hp} / 攻撃 ${me.atk} / 防御 ${pct(me.def)} / クリ ${pct(me.crit)}×${me.critMul}
              <ul>${me.skills.map((s, i) => `<li>スキル${i + 1}「${s.name}」(ゲージ${s.cost}): ${s.desc}</li>`).join('')}</ul></div>
          </div>
          <div class="panel form" style="max-width:none">
            <label class="field"><span>敵のキャラ</span><select id="foe">${CHARACTERS.map(c => `<option value="${c.id}" ${c.id === cfg.foe ? 'selected' : ''}>${c.name}(${c.role})</option>`).join('')}</select></label>
            <div class="field"><span>単語の形式</span>${seg('format', FORMATS.map(f => [f.id, f.name]), cfg.format)}</div>
            <div class="field"><span>敵の強さ(ランク帯の目安)</span>${seg('preset', RANK_PRESETS.map(p => [p.id, p.name]), cfg.preset)}</div>
            <label class="field"><span>敵のCPM <output id="o-cpm">${cfg.cpm}</output></span><input type="range" id="cpm" min="50" max="600" step="5" value="${cfg.cpm}"></label>
            <label class="field"><span>敵の正確率 <output id="o-acc">${cfg.acc}%</output></span><input type="range" id="acc" min="70" max="100" value="${cfg.acc}"></label>
            <div class="field"><span>敵のスキル</span>${seg('skill', SKILL_MODES, cfg.skill)}</div>
            <div class="field"><span>制限時間</span>${seg('limit', [[60, '60秒'], [0, '無制限']], cfg.limit)}</div>
            <label class="field"><span><input type="checkbox" id="dummy" ${cfg.dummy ? 'checked' : ''}>敵は入力しない(ダミー)</span></label>
          </div>
        </div>
        <div class="row"><button class="btn primary" id="start">バトル開始</button><button class="btn" id="back">メニューへ戻る</button></div>`;
    };
    draw();

    el.addEventListener('click', e => {
      const t = e.target, card = t.closest('[data-me]'), b = t.closest('[data-seg] button');
      if (card) { cfg.me = card.dataset.me; save(); draw(); el.querySelector(`[data-me="${cfg.me}"]`)?.focus(); }
      else if (b) {
        const name = b.parentElement.dataset.seg, v = b.dataset.v;
        if (name === 'preset') { const p = RANK_PRESETS.find(x => x.id === v); Object.assign(cfg, { preset: v, cpm: p.cpm, acc: p.acc }); }
        else cfg[name] = name === 'limit' ? +v : v;
        save(); draw();
      } else if (t.id === 'start') { save(); go('battle', { cfg: { ...cfg } }); }
      else if (t.id === 'back') go('menu');
    });
    el.addEventListener('input', e => {
      const t = e.target;
      if (t.id === 'cpm' || t.id === 'acc') {
        cfg[t.id] = +t.value; cfg.preset = '';
        el.querySelector(`#o-${t.id}`).textContent = t.id === 'acc' ? `${t.value}%` : t.value;
        el.querySelectorAll('[data-seg="preset"] button').forEach(x => x.setAttribute('aria-pressed', 'false'));
        save();
      }
    });
    el.addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'foe') cfg.foe = t.value;
      else if (t.id === 'dummy') cfg.dummy = t.checked;
      else return;
      save();
    });
    const onKey = e => { if (e.key === 'Escape' && !e.target.closest?.('select')) go('menu'); };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  },
};

// training画面から cfg を受け取る。cfg なし(マッチング経由の仮接続)のときは既定のCPU戦。
const BATTLE_DEFAULT = { me: 'thief', foe: 'golem', format: 'daily', cpm: 250, acc: 95, skill: 'ready', limit: 60, dummy: false, firstTo: 1, kind: 'training' };
const keyToChar = code => (/^Key[A-Z]$/.test(code) ? code[3].toLowerCase() : code === 'Minus' ? '-' : null);
const END_WHY = { ko: 'KO', time: '時間切れ(HPの割合で判定)', count: '時間切れ(入力文字数で判定)', draw: '同点', surrender: '降参' };
const keyLabel = c => c.split('+').map(p => p.replace(/^(Key|Digit)/, '')).join(' + ');

const battleScreen = {
  mount(el, { store, go, params }) {
    const cfg = { ...BATTLE_DEFAULT, ...(params.cfg ?? {}) };
    const fromTraining = cfg.kind === 'training', online = cfg.kind === 'online';
    const me = charById(cfg.me), foe = charById(cfg.foe);
    const skillKeys = store.get().settings.skillKeys;
    let mobile = isMobile(); // スマホ入力: 1文字のダメージが1.5倍(ローマ字1打鍵・かな1文字)
    const skillBox = (c, mine) => c.skills.map((s, i) => `<div class="skill" data-sk="${i}"><kbd>${mine ? (mobile ? 'タップ' : keyLabel(skillKeys[i])) : ''}</kbd><b>${s.name}</b><small>${s.desc}</small></div>`).join('');

    el.innerHTML = `
      <div class="battle">
        ${mobile ? '<button class="mbtn" data-a="mmenu" type="button" aria-label="メニュー">☰</button>' : ''}
        <div class="bt-top">
          <div class="bt-side"><div class="bt-name">${me.name}<small>${me.role}</small>${cfg.meIgn ? `<em>${esc(cfg.meIgn)}</em>` : ''}<span class="pv" title="${esc(me.passive.desc)}">${me.passive.name}</span></div><div class="hpbar"><i class="hp-ghost"></i><i class="hp-fill"></i></div><div class="hp-num"></div></div>
          <div class="bt-timer"><span id="clock">60</span><small>秒</small><div class="pips" id="pips"></div></div>
          <div class="bt-side right"><div class="bt-name">${foe.name}<small>${foe.role}</small>${cfg.foeIgn ? `<em>${esc(cfg.foeIgn)}</em>` : ''}<span class="pv" title="${esc(foe.passive.desc)}">${foe.passive.name}</span></div><div class="hpbar"><i class="hp-ghost"></i><i class="hp-fill"></i></div><div class="hp-num"></div><div class="mini-gauge"><i id="g2"></i></div></div>
        </div>
        <div class="stage"><div class="fighter l"><div class="aura"></div><div class="idle">${charArt(me)}</div></div><div class="fighter r"><div class="aura"></div><div class="idle">${charArt(foe)}</div></div><div class="fxl"></div><div class="flash"></div><div class="banner"></div></div>
        <div class="typing"><div class="t-disp"></div><div class="t-kana"></div><div class="t-rom"></div>${mobile ? `<input id="mi" class="mi" type="text" inputmode="text" lang="ja" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="ここに入力"><div class="t-hint">ここをタップして入力(1文字のダメージ${RULES.MOBILE_MULT}倍)</div><button class="imebtn" data-a="ime" type="button"></button>` : ''}</div>
        <div class="hud-b">
          <div class="combo"><b id="combo">0</b>コンボ</div>
          <div><div class="gauge"><div class="g-fill" id="g1"></div>${me.skills.map(sk => `<i class="tick" style="left:${(sk.cost / 300) * 100}%"></i>`).join('')}</div></div>
        </div>
        <div class="skills">${skillBox(me, true)}</div>
        <div class="overlay" hidden></div>
      </div>`;
    const $ = q => el.querySelector(q), $$ = q => [...el.querySelectorAll(q)];
    const root = $('.battle'), stage = $('.stage'), overlay = $('.overlay'), banner = $('.banner');
    const fighters = { p1: $('.fighter.l'), p2: $('.fighter.r') };
    const bars = { p1: $$('.hpbar')[0], p2: $$('.hpbar')[1] }, nums = $$('.hp-num');
    stage.style.setProperty('--me', ACCENT[me.id]); stage.style.setProperty('--foe', ACCENT[foe.id]);
    const fx = createFx({ arena: root, stage, fighters, chars: { p1: me, p2: foe }, banner, chips: $$('.pv'), on: store.get().settings.fx });

    let battle, bot, wi, word, queue, qi, phase = 'count', last = 0, raf = 0, timers = [], stats, score = [0, 0], round = 1, tot, forfeit = false, summary = null, menuOpen = false, matchOver = false, lastHurt = 0;
    let imeMode = 'kana', prevIn = '', mi = null; // 入力方式: kana(日本語キーボード) / roman(英字キーボード)
    try { if (localStorage.getItem('tb.ime') === 'roman') imeMode = 'roman'; } catch { /* 無視 */ }
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));
    const remote = {
      snap: null, evq: [],
      state() {
        const x = this.snap, rem = x ? Math.max(0, x.rem - (performance.now() - x.at) / 1000) : cfg.limit;
        const blank = c => ({ hp: c.hp, max: c.hp, combo: 0, gauge: 0, fx: [] });
        return { t: Math.max(0, cfg.limit - rem), remaining: rem, p1: { ...(x ? x.me : blank(me)), hits: 0, miss: 0 }, p2: { ...(x ? x.foe : blank(foe)), hits: 0, miss: 0 } };
      },
      drain() { const e = this.evq; this.evq = []; return e; },
      step() {}, hit() {}, miss() {},
      skill(side, i) { conn.send({ t: 'skill', i }); return true; },
      surrender() { conn.send({ t: 'surrender' }); },
    };

    const nextWord = () => { word = queue[qi++ % queue.length]; wi = createWordInput(word); if (mi) { mi.value = ''; prevIn = ''; } paintWord(); };
    const paintWord = () => {
      const v = wi.view();
      $('.t-disp').textContent = word.t !== word.r ? word.t : '';
      $('.t-kana').innerHTML = `<span class="done">${esc(v.kanaDone)}</span>${v.pending ? `<span class="pend">${esc(v.pending)}</span>` : ''}${esc(v.kanaRest)}`;
      $('.t-rom').innerHTML = `<span class="done">${esc(v.typed)}</span><span class="rest"><u>${esc(v.rest[0] ?? '')}</u>${esc(v.rest.slice(1))}</span>`;
    };

    const paint = () => {
      const s = battle.state();
      ['p1', 'p2'].forEach((side, k) => {
        const p = s[side], w = `${Math.max(0, (p.hp / p.max) * 100)}%`;
        const [ghost, fill] = bars[side].children;
        ghost.style.width = w; fill.style.width = w; fill.classList.toggle('low', p.hp / p.max < 0.3);
        nums[k].textContent = `${Math.ceil(p.hp)} / ${p.max}`;
      });
      $('#clock').textContent = Number.isFinite(s.remaining) ? Math.ceil(s.remaining) : '∞';
      $('#combo').textContent = s.p1.combo;
      $('#g1').style.width = `${(s.p1.gauge / 300) * 100}%`;
      $('#g2').style.width = `${(s.p2.gauge / 300) * 100}%`;
      $$('.skill').forEach((x, i) => x.classList.toggle('ready', s.p1.gauge >= me.skills[i].cost));
      $('.gauge').classList.toggle('hot', s.p1.gauge >= Math.min(...me.skills.map(k => k.cost)));
      fx.auras(s);
    };

    const float = (side, text, cls) => {
      const d = document.createElement('span');
      d.className = `dmg ${cls}`; d.textContent = text;
      d.style.left = `${(side === 'p1' ? 12 : 64) + Math.random() * 18}%`; d.style.top = `${10 + Math.random() * 38}%`;
      stage.append(d);
      d.animate([{ transform: 'translateY(0) scale(.9)', opacity: 1 }, { transform: 'translateY(-46px) scale(1.1)', opacity: 0 }], { duration: 650, easing: 'ease-out' }).onfinish = () => d.remove();
    };
    const comboPop = () => store.get().settings.fx && $('.combo b').animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 120 });

    const handleEvents = () => {
      for (const e of battle.drain()) {
        if (e.type === 'hit') {
          float(e.side === 'p1' ? 'p2' : 'p1', Math.round(e.dmg), e.crit ? 'crit' : '');
          fx.hit(e.side, e);
          if (e.side === 'p1') { if (e.crit) sfx('crit'); } else if (performance.now() - lastHurt > 90) { lastHurt = performance.now(); sfx(e.crit ? 'crit' : 'hurt'); }
          if (e.side === 'p1' && [10, 25, 50, 100].includes(e.combo)) sfx('combo');
          if ([10, 25, 50, 100].includes(e.combo)) fx.combo(e.side, e.combo);
          if (e.side === 'p1' && e.combo > 1) comboPop();
          if (e.side === 'p1') { stats.dmg += e.dmg; stats.maxCombo = Math.max(stats.maxCombo, e.combo); }
        } else if (e.type === 'miss') {
          if (e.self) float(e.side, `-${Math.round(e.self)}`, 'self');
          if (e.side === 'p1') {
            $('.flash').animate([{ opacity: 0.4 }, { opacity: 0 }], { duration: 240 });
            root.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], { duration: 150 });
          }
        } else if (e.type === 'skill') { const ch = e.side === 'p1' ? me : foe; sfx(ch.skills[e.idx].fx.some(f => f.t === 'heal') ? 'heal' : 'skill'); fx.skill(e.side, ch.skills[e.idx], ch); }
        else if (e.type === 'end') roundEnd(e);
      }
    };

    const stat = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
    const addTot = () => {
      const x = battle.state();
      tot.t += x.t; tot.hits += x.p1.hits; tot.miss += x.p1.miss; tot.dmg += stats.dmg; tot.maxCombo = Math.max(tot.maxCombo, stats.maxCombo);
    };
    const paintPips = () => {
      const n = cfg.firstTo, dots = k => '●'.repeat(score[k]) + '○'.repeat(n - score[k]);
      $('#pips').innerHTML = n > 1 ? `<b>${dots(0)}</b><i>ROUND ${round}</i><b>${dots(1)}</b>` : '';
    };
    const roundEnd = e => {
      phase = 'over';
      if (e.reason === 'ko') sfx('ko');
      const d = fx.end(e);
      if (online) {
        return later(() => {
          banner.textContent = '';
          if (!matchOver) { banner.textContent = e.winner === 'p1' ? 'ROUND WIN!' : e.winner === 'p2' ? 'ROUND LOSE' : 'DRAW やり直し'; banner.classList.toggle('go', e.winner === 'p1'); }
        }, d);
      }
      if (d) later(() => roundEndNow(e), d); else roundEndNow(e);
    };
    const roundEndNow = e => {
      phase = 'over'; banner.textContent = ''; addTot();
      if (cfg.firstTo <= 1) return finish(e.winner, e.reason);
      if (e.winner === 'p1') score[0]++; else if (e.winner === 'p2') score[1]++;
      paintPips();
      if (forfeit) return finish('p2', 'surrender');
      if (score[0] >= cfg.firstTo || score[1] >= cfg.firstTo) return finish(score[0] > score[1] ? 'p1' : 'p2', e.reason);
      banner.textContent = e.winner === 'p1' ? 'ROUND WIN!' : e.winner === 'p2' ? 'ROUND LOSE' : 'DRAW やり直し';
      banner.classList.toggle('go', e.winner === 'p1');
      banner.animate([{ transform: 'scale(1.5)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 240, easing: 'ease-out' });
      if (e.winner !== 'draw') round++;
      later(() => { banner.textContent = ''; start(); }, 1900);
    };
    const finish = (winner, reason) => {
      phase = 'over';
      const t = Math.max(tot.t, 0.001), tries = tot.hits + tot.miss;
      const title = winner === 'p1' ? '勝利!' : winner === 'p2' ? '敗北' : winner === 'none' ? '練習おわり' : '引き分け';
      if (winner === 'p1') sfx('win'); else if (winner === 'p2') sfx('lose');
      summary = { win: winner, score: [...score], tot: { ...tot }, mode: cfg.mode, firstTo: cfg.firstTo };
      overlay.innerHTML = `<div class="box"><h2>${title}</h2><p class="sub">${cfg.firstTo > 1 ? `${score[0]} - ${score[1]}　` : ''}${winner === 'none' ? '' : END_WHY[reason] ?? ''}</p>
        <dl>${stat('経過時間', `${t.toFixed(1)}秒`)}${stat('CPM', Math.round((tot.hits / t) * 60))}${stat('正確率', tries ? `${((tot.hits / tries) * 100).toFixed(1)}%` : '-')}
        ${stat('最大コンボ', tot.maxCombo)}${stat('ミス', tot.miss)}${stat('与えたダメージ', Math.round(tot.dmg))}${stat('秒間ダメージ', Math.round(tot.dmg / t))}</dl>
        <div class="row">${fromTraining ? '<button class="btn primary" data-a="again">もう一度</button><button class="btn" data-a="setup">設定に戻る</button>' : '<button class="btn primary" data-a="result">結果へ</button>'}<button class="btn" data-a="menu">メニューへ</button></div></div>`;
      overlay.hidden = false; overlay.querySelector('button').focus();
    };

    const countdown = (ms = 2100) => {
      const seq = ['3', '2', '1', 'FIGHT!'];
      seq.forEach((txt, n) => later(() => {
        sfx(n === 3 ? 'go' : 'count');
        banner.textContent = txt; banner.classList.toggle('go', n === 3);
        banner.animate([{ transform: 'scale(1.5)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 220, easing: 'ease-out' });
        if (n === 3) { phase = 'fight'; last = performance.now(); later(() => { banner.textContent = ''; }, 700); }
      }, n * (ms / 3)));
    };

    const start = () => {
      timers.forEach(clearTimeout); timers = [];
      const seed = (Math.random() * 2 ** 32) >>> 0, rng = mulberry32(seed);
      battle = createBattle({ chars: [me, foe], rng, duration: cfg.limit || Infinity });
      bot = cfg.dummy ? null : createBot({ cpm: cfg.cpm, accuracy: cfg.acc / 100, skillMode: cfg.skill, rng: mulberry32(seed ^ 0x9e3779b9) });
      queue = makeQueue(cfg.format, seed); qi = 0;
      stats = { dmg: 0, maxCombo: 0 };
      overlay.hidden = true; banner.textContent = ''; fx.reset();
      nextWord(); paint(); paintPips(); phase = 'count'; countdown();
    };
    const onRound = m => { // サーバーから「ラウンド開始」が届いた
      timers.forEach(clearTimeout); timers = [];
      queue = makeQueue(cfg.format, m.seed); qi = 0; stats = { dmg: 0, maxCombo: 0 };
      remote.snap = null; remote.evq = []; score = m.score; round = m.n;
      overlay.hidden = true; banner.textContent = ''; fx.reset(); menuOpen = false;
      nextWord(); paint(); paintPips(); phase = 'count'; countdown(m.startIn);
    };
    const newSeries = () => { score = [0, 0]; round = 1; tot = { t: 0, hits: 0, miss: 0, dmg: 0, maxCombo: 0 }; forfeit = false; start(); };

    const pauseMenu = () => {
      phase = 'pause';
      overlay.innerHTML = `<div class="box"><h2>一時停止</h2><p class="sub">${fromTraining ? 'トレーニング' : ''}</p><div class="row" style="margin-top:0">
        <button class="btn primary" data-a="resume">再開</button>${fromTraining ? '<button class="btn" data-a="again">やり直す</button>' : ''}
        ${cfg.limit ? '' : '<button class="btn" data-a="end">練習を終える</button>'}<button class="btn" data-a="surrender">降参</button>
        ${fromTraining ? '<button class="btn" data-a="setup">設定に戻る</button>' : ''}<button class="btn" data-a="menu">メニューへ</button></div></div>`;
      overlay.hidden = false; overlay.querySelector('button').focus();
    };
    const onlineMenu = () => {
      menuOpen = !menuOpen;
      if (!menuOpen) { overlay.hidden = true; return; }
      overlay.innerHTML = '<div class="box"><h2>メニュー</h2><p class="sub">対戦中は一時停止できません</p><div class="row" style="margin-top:0"><button class="btn primary" data-a="close">戻る</button><button class="btn" data-a="surrender">降参する</button></div></div>';
      overlay.hidden = false; overlay.querySelector('button').focus();
    };
    const resume = () => { overlay.hidden = true; phase = 'fight'; last = performance.now(); };

    overlay.addEventListener('click', e => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (a === 'resume') resume();
      else if (a === 'again') newSeries();
      else if (a === 'result') go('result', { summary });
      else if (a === 'close') { menuOpen = false; overlay.hidden = true; }
      else if (a === 'surrender') { if (online) { menuOpen = false; overlay.hidden = true; battle.surrender('p1'); } else { forfeit = true; resume(); battle.surrender('p1'); handleEvents(); } }
      else if (a === 'end') { addTot(); finish('none', ''); }
      else if (a === 'setup') go('training');
      else if (a === 'menu') go('menu');
    });

    const onKey = e => {
      if (e.repeat) return;
      if (e.key === 'Escape') { if (online) { if (!matchOver && phase !== 'over') onlineMenu(); } else if (phase === 'fight') pauseMenu(); else if (phase === 'pause') resume(); return; }
      if (phase !== 'fight' || menuOpen) return;
      const combo = `${e.altKey ? 'Alt+' : ''}${e.shiftKey ? 'Shift+' : ''}${e.code}`;
      const sk = store.get().settings.skillKeys.indexOf(combo);
      if (sk >= 0) { e.preventDefault(); battle.skill('p1', sk); return; }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const ch = keyToChar(e.code); if (!ch) return;
      if (mobile && /^Key[A-Z]$/.test(e.code) && !e.isComposing && e.keyCode !== 229) { // 外付けキーボードで打っている → スマホ扱いをやめる
        mobile = false; mi?.remove(); mi = null; if (online) conn.send({ t: 'device', d: 'pc' });
        root.classList.add('hwkb'); $$('.skill kbd').forEach((k, i) => { k.textContent = keyLabel(skillKeys[i]); });
      }
      e.preventDefault();
      feed('r', ch);
    };

    // 1文字の入力(kind: 'r'=ローマ字 / 'k'=かな)。サーバー対戦では、同じ内容をサーバーへ送って判定してもらう
    const feed = (kind, ch, replace = false) => {
      if (!wi || phase !== 'fight' || menuOpen) return;
      if (online) conn.send(kind === 'r' ? { t: 'key', c: ch } : { t: 'kc', c: ch, r: replace ? 1 : 0 });
      for (const r of wi.press(kind, ch, replace)) {
        if (r === 'miss') { if (!online) battle.miss('p1'); sfx('miss'); }
        else if (r === 'ok' || r === 'done') { if (!online) battle.hit('p1', mobile ? RULES.MOBILE_MULT : 1); sfx('key'); if (r === 'done') { nextWord(); return; } }
      }
      paintWord();
    };

    // スマホ: 入力欄(画面下のタップ領域)の内容の変化から、打った文字を読み取る
    const toHira = t => t.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    const onInput = () => {
      const cur = toHira(mi.value.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))).replace(/\s+/g, '');
      if (phase !== 'fight' || menuOpen) { mi.value = ''; prevIn = ''; return; }
      let k = 0; while (k < prevIn.length && k < cur.length && prevIn[k] === cur[k]) k++;
      const removed = prevIn.slice(k), added = cur.slice(k);
      prevIn = cur;
      if (!added) return; // 削除など
      const isK = c => /[ぁ-ゖー]/.test(c);
      if (imeMode === 'roman') { if (!removed) for (const c of added) if (/[a-z-]/i.test(c)) feed('r', c.toLowerCase()); return; }
      // かな: 濁点などで直前の1文字が置き換わった場合は replace。ローマ字かな変換(k→か)で英字が仮に出たあとは、かなになった時点で1文字と数える
      const replace = removed.length > 0 && isK(removed.slice(-1)) && added.length === 1 && isK(added);
      for (const c of added) if (isK(c)) feed('k', c, replace);
    };
    const setIme = mode => {
      const changed = imeMode !== mode;
      imeMode = mode; try { localStorage.setItem('tb.ime', mode); } catch { /* 無視 */ }
      if (changed && wi && word) { wi = createWordInput(word); if (online) conn.send({ t: 'reset' }); paintWord(); } // 入力方式を変えたら、この単語を打ち直す
      const btn = $('.imebtn'); if (btn) btn.textContent = mode === 'kana' ? '入力: かな(日本語キーボード)' : '入力: ローマ字(英字キーボード)';
      if (mi) { mi.value = ''; prevIn = ''; mi.setAttribute('inputmode', mode === 'kana' ? 'text' : 'email'); mi.setAttribute('lang', mode === 'kana' ? 'ja' : 'en'); if (document.activeElement === mi) { mi.blur(); mi.focus(); } }
    };
    mi = $('#mi');
    if (mi) {
      mi.addEventListener('input', onInput);
      mi.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
      mi.addEventListener('focus', () => root.classList.add('kb')); mi.addEventListener('blur', () => root.classList.remove('kb'));
      el.addEventListener('pointerdown', e => { if (e.target.closest('.skill, .mbtn, .imebtn')) e.preventDefault(); }); // キーボードを閉じない
      setIme(imeMode);
    }
    el.addEventListener('click', e => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (a === 'ime') setIme(imeMode === 'kana' ? 'roman' : 'kana');
      else if (a === 'mmenu') { if (online) { if (!matchOver && phase !== 'over') onlineMenu(); } else if (phase === 'fight') pauseMenu(); else if (phase === 'pause') resume(); }
    });
    el.addEventListener('pointerdown', e => { // スキルはタップで発動(スマホ)
      const sk = e.target.closest('.skill'); if (!sk || phase !== 'fight' || menuOpen) return;
      battle.skill('p1', +sk.dataset.sk);
    });

    const frame = now => {
      raf = requestAnimationFrame(frame);
      if (phase === 'fight') {
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        battle.step(dt); bot?.step(dt, battle, 'p2');
      }
      if (phase !== 'pause') { handleEvents(); paint(); }
    };

    addEventListener('keydown', onKey);
    const offs = [];
    if (online) {
      battle = remote; paint();
      offs.push(conn.on('snap', m => { remote.snap = { ...m, at: performance.now() }; }));
      offs.push(conn.on('ev', m => remote.evq.push(...m.list)));
      offs.push(conn.on('round', onRound));
      offs.push(conn.on('round_end', m => { score = m.score; paintPips(); }));
      offs.push(conn.on('match_end', m => { matchOver = true; menuOpen = false; later(() => go('result', { summary: m }), m.reason === 'ko' || m.reason === 'time' ? 2600 : 1200); }));
      offs.push(conn.on('_close', () => { if (!matchOver) { phase = 'over'; overlay.innerHTML = '<div class="box"><h2>接続が切れました</h2><p class="sub">サーバーとの通信が途切れました</p><div class="row"><button class="btn primary" data-a="menu">メニューへ</button></div></div>'; overlay.hidden = false; } }));
      if (params.round) onRound(params.round);
    } else newSeries();
    raf = requestAnimationFrame(frame);
    return () => { offs.forEach(f => f()); cancelAnimationFrame(raf); timers.forEach(clearTimeout); removeEventListener('keydown', onKey); };
  },
};

// ---- js/screens/draft.js
// BAN/PICK。進行・時間切れの処理はサーバーが行う。ここは選択の表示と送信だけ






const fname = id => FORMATS.find(f => f.id === id)?.name ?? id;
const STEP_NAME = { ban: 'キャラBAN', pick: 'キャラPICK', format: '単語形式BAN' };

const draftScreen = {
  mount(el, { store, go }) {
    const match = store.get().match;
    if (!match) { go('menu'); return; }
    const ranked = match.mode === 'ranked', steps = ranked ? ['ban', 'pick', 'format'] : ['pick', 'format'];
    const ids = CHARACTERS.map(c => c.id);
    const S = { step: null, secs: 7, left: 7, at: 0, avail: ids, fmts: [], sel: [], locked: false, note: '', bans: { mine: [], theirs: [] }, fmtRes: null };
    let lastTick = 0;
    const need = () => (S.step === 'ban' ? 2 : 1);

    const render = () => {
      if (!S.step) { el.innerHTML = '<div class="dr"><h2 class="dr-guide">準備しています…</h2></div>'; return; }
      const showBans = ranked && (S.step !== 'ban' || S.locked), banned = id => S.bans.mine.includes(id) || S.bans.theirs.includes(id);
      const guide = { ban: `使わせたくないキャラを2体選んでください(${S.sel.length}/2)`, pick: '使うキャラを選んでください(相手には見えません)', format: '使わせたくない単語形式を1つ選んでください' }[S.step];
      const cards = S.step === 'format'
        ? `<div class="dr-fmts">${S.fmts.map(f => `<button class="dr-fmt ${S.sel[0] === f && !S.fmtRes ? 'sel' : ''} ${S.fmtRes && (S.fmtRes.mine === f || S.fmtRes.theirs === f) ? 'ban' : ''} ${S.fmtRes?.final === f ? 'final' : ''}" data-id="${f}"><b>${fname(f)}</b>${S.fmtRes?.mine === f ? '<em>あなたのBAN</em>' : ''}${S.fmtRes?.theirs === f ? '<em>相手のBAN</em>' : ''}${S.fmtRes?.final === f ? '<em>使用決定</em>' : ''}</button>`).join('')}</div>`
        : `<div class="dr-grid">${ids.map(id => {
          const c = charById(id), b = showBans && banned(id), mine = S.bans.mine.includes(id), theirs = S.bans.theirs.includes(id);
          return `<button class="dr-card ${S.sel.includes(id) ? 'sel' : ''} ${b ? 'ban' : ''}" data-id="${id}"><span class="dr-art">${charArt(c)}</span><b>${c.name}</b><small>${c.role}</small>${b ? `<i>${mine && theirs ? '両者BAN' : mine ? '自分のBAN' : '相手のBAN'}</i>` : ''}</button>`;
        }).join('')}</div>`;
      el.innerHTML = `<div class="dr">
        <div class="dr-head"><div class="dr-steps">${steps.map(s => `<span class="${s === S.step ? 'on' : steps.indexOf(s) < steps.indexOf(S.step) ? 'done' : ''}">${STEP_NAME[s]}</span>`).join('')}</div>
          <div class="dr-ring" style="--p:${(S.left / S.secs) * 100}"><b>${Math.ceil(S.left)}</b></div></div>
        <h2 class="dr-guide">${S.note || (S.locked ? '相手を待っています…' : guide)}</h2>${cards}
        <div class="row"><button class="btn primary" id="ok" ${S.locked || S.sel.length !== need() ? 'disabled' : ''}>決定</button><span class="dr-sub">${ranked ? 'ランクマッチ・BANは両者に公開されます' : '通常マッチ'} / 時間切れはランダムで決まります</span></div></div>`;
    };
    const onPhase = m => {
      Object.assign(S, { step: m.step, secs: m.secs, left: m.secs, at: performance.now(), avail: m.avail ?? ids, fmts: m.fmts ?? [], sel: [], locked: false, note: '', fmtRes: null });
      if (m.bans) S.bans = m.bans;
      render();
    };
    const commit = () => {
      if (S.locked || S.sel.length !== need()) return;
      S.locked = true; sfx('ui_ok');
      conn.send(S.step === 'ban' ? { t: 'ban', ids: S.sel } : S.step === 'pick' ? { t: 'pick', id: S.sel[0] } : { t: 'fmt', id: S.sel[0] });
      render();
    };
    const offs = [
      conn.on('phase', onPhase),
      conn.on('ban_result', m => { S.bans = { mine: m.mine, theirs: m.theirs }; S.locked = true; S.note = 'BANが決まりました'; sfx('ban'); render(); }),
      conn.on('pick_ok', () => { S.locked = true; S.note = 'ロックイン完了!'; sfx('pick'); render(); }),
      conn.on('fmt_result', m => { S.fmtRes = m; S.locked = true; S.note = `今回の単語形式は「${fname(m.final)}」`; sfx('ban'); render(); }),
      conn.on('vs', m => { store.set(s => ({ match: { ...s.match, vs: m } })); go('vs'); }),
      conn.on('match_end', m => go('result', { summary: m })),
      conn.on('_close', () => { el.innerHTML = '<div class="dr"><h2 class="dr-guide">サーバーとの接続が切れました</h2><div class="row"><button class="btn primary" id="home">メニューへ</button></div></div>'; }),
    ];
    el.addEventListener('click', e => {
      if (e.target.closest('#home')) return go('menu');
      if (S.locked) return;
      if (e.target.closest('#ok')) return commit();
      const c = e.target.closest('[data-id]'); if (!c) return;
      const id = c.dataset.id;
      if (S.step !== 'format' && !S.avail.includes(id)) return;
      if (S.step === 'ban') S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : S.sel.length < 2 ? [...S.sel, id] : S.sel;
      else S.sel = [id];
      sfx('ui_move'); render();
    });
    const onKey = e => { if (e.key === 'Enter') commit(); };
    addEventListener('keydown', onKey);
    const tick = setInterval(() => {
      if (!S.step || S.locked) return;
      S.left = Math.max(0, S.secs - (performance.now() - S.at) / 1000);
      const ring = el.querySelector('.dr-ring');
      if (ring) { ring.style.setProperty('--p', (S.left / S.secs) * 100); ring.firstChild.textContent = Math.ceil(S.left); }
      if (S.left <= 3 && Math.ceil(S.left) !== lastTick && S.left > 0) { lastTick = Math.ceil(S.left); sfx('tick'); }
    }, 100);
    render();
    const first = LAST.phase;
    if (first && first.seq > (match.foundSeq ?? 0)) onPhase(first); // 画面の切り替え中に届いていた場合
    return () => { clearInterval(tick); offs.forEach(f => f()); removeEventListener('keydown', onKey); };
  },
};

        <div class="cx-bar"><span>使用率</span><i><u style="width:${Math.min(100, share * 100 * 2.5)}%"></u></i><b>${(share * 100).toFixed(1)}%</b></div>
        <div class="cx-bar"><span>勝率</span><i class="wr"><u style="width:${wr * 100}%"></u></i><b>${x.picks ? (wr * 100).toFixed(1) + '%' : '―'}</b></div>
        <p class="note">${x.picks ? `使用率 ${rank}位 / 8体` : 'まだ対戦の記録がありません'}${mine ? `　あなた: ${mine.played}戦 ${mine.wins}勝(${((mine.wins / mine.played) * 100).toFixed(0)}%)` : ''}</p></div>`;
    };
    (async () => {
      try {
        let token = null; try { token = localStorage.getItem('tb.token'); } catch { /* 無視 */ }
        const r = await fetch('/api/charstats', { headers: token ? { Authorization: `Bearer ${token}` } : {} });
        if (!r.ok) throw new Error('x');
        stats = await r.json();
      } catch { failed = true; }
      paint();
    })();
    el.addEventListener('click', e => {
      const b = e.target.closest('.cx-item');
      if (b) { cur = +b.dataset.i; paint(); } else if (e.target.id === 'back') go('menu');
    });
    const onKey = e => {
      const d = { ArrowRight: 1, ArrowDown: 4, ArrowLeft: -1, ArrowUp: -4 }[e.key];
      if (d) { cur = (cur + d + CHARACTERS.length) % CHARACTERS.length; paint(); items[cur].focus(); e.preventDefault(); }
      else if (e.key === 'Escape') go('menu');
    };
    addEventListener('keydown', onKey);
    paint(); items[0].focus();
    return () => removeEventListener('keydown', onKey);
  },
};

// ---- js/screens/titles.js




const titlesScreen = {
  mount(el, { store, go }) {
    let cat = 'all';
    el.innerHTML = `<h1>称号</h1><div class="tt-top"><div class="tt-tabs">${TITLE_CATS.map(([id, n]) => `<button class="seg-b" data-cat="${id}">${n}</button>`).join('')}</div><span class="tt-count"></span></div>
      <div class="tt-list"></div><div class="row"><button class="btn" id="back">メニューへ戻る</button></div>`;
    const $ = q => el.querySelector(q);
    const paint = () => {
      const st = store.get(), own = new Set(st.profile.titles), eq = equippedTitle(st);
      el.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === cat));
      $('.tt-count').textContent = `獲得 ${own.size} / ${TITLES.length}${eq ? '' : '　装備中: なし'}`;
      $('.tt-list').innerHTML = TITLES.filter(t => cat === 'all' || t.cat === cat).map(t => {
        const has = own.has(t.id), r = RARITY[t.r], hide = t.hidden && !has;
        return `<div class="tt-item ${has ? 'own' : ''} ${eq === t.id ? 'eq' : ''}" style="--rc:${r.color}"><div><small>${r.name}</small><b>${hide ? '？？？？？' : esc(t.name)}</b><span>${hide ? '条件: ？？？' : esc(t.cond)}</span></div>
          ${has ? `<button class="btn ${eq === t.id ? '' : 'primary'}" data-eq="${t.id}">${eq === t.id ? '外す' : '装備'}</button>` : '<em>未獲得</em>'}</div>`;
      }).join('');
    };
    el.addEventListener('click', e => {
      const c = e.target.closest('[data-cat]'), q = e.target.closest('[data-eq]');
      if (c) { cat = c.dataset.cat; paint(); }
      else if (q) { const own = store.get().profile.titles.includes(q.dataset.eq); if (!own) return; const id = equippedTitle(store.get()) === q.dataset.eq ? null : q.dataset.eq; saveSettings({ title: id }); paint(); }
      else if (e.target.id === 'back') go('menu');
    });
    const onKey = e => { if (e.key === 'Escape') go('menu'); };
    addEventListener('keydown', onKey);
    paint();
    return () => removeEventListener('keydown', onKey);
  },
};

// ---- js/main.js


















registerScreens({ menu: menuScreen, settings: settingsScreen, training: trainingScreen, battle: battleScreen, matching: matchingScreen, draft: draftScreen, vs: vsScreen, result: resultScreen, codex: codexScreen, titles: titlesScreen });
applySettings(store.get().settings);
mountAccountBar(document.getElementById('acct'));
startRouter(document.getElementById('app'), 'menu');
document.documentElement.classList.toggle('is-mobile', isMobile());
initAudio();
restoreSession().then(u => { if (u) applyUser(u); }).finally(() => conn.connect());

})();
